<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>머니플래너</title>
<meta name="description" content="개인 자산, 가족 월별 예산, 월 생활비를 관리하는 개인 가계부">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="머니플래너">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html,body{ margin:0; padding:0; }
  :root{
    color-scheme:light;
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-alt:#F4F6F8;
    --ink:#181C22;
    --muted:#8B95A1;
    --line:#EDEFF2;
    --accent:#3182F6;
    --accent-ink:#FFFFFF;
    --accent-soft:#EAF2FE;
    --positive:#17BF83;
    --negative:#F0424E;
    --warning:#FFA929;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:9px;
    --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }

  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  /* ---- animation system ---- */
  @keyframes mp-card-expand{ from{ opacity:0; transform:scale(.97); } to{ opacity:1; transform:scale(1); } }
  @keyframes mp-reveal{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes mp-tab-fade-in{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:translateY(0); } }

  .mp-btn, .mp-icon-btn, .mp-tab, .mp-sort-btn, .mp-fixed-toggle-btn, .mp-month-btn,
  .mp-reset-btn, .mp-account:not(.is-expanded), .mp-color-swatch, .mp-log-toggle{
    transition: transform .12s ease, background-color .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease, box-shadow .15s ease;
  }
  .mp-btn:active, .mp-icon-btn:active, .mp-sort-btn:active, .mp-fixed-toggle-btn:active,
  .mp-month-btn:active, .mp-reset-btn:active, .mp-account:not(.is-expanded):active, .mp-log-toggle:active{
    transform: scale(.96);
  }
  .mp-tab:active{ transform: scale(.93); }
  .mp-tab.active::before{ transition: opacity .15s ease, transform .15s ease; }

  .mp-account.is-expanded{ animation: mp-card-expand .22s ease; }
  .mp-account-settings-panel, .mp-month-picker, .mp-reveal-panel{ animation: mp-reveal .18s ease; }
  .mp-main.mp-tab-fade{ animation: mp-tab-fade-in .2s ease; }

  .mp-total, .mp-account-total{ transition: color .2s ease; }
  .mp-progress > div{ transition: width .3s ease, background-color .2s ease; }

  body{ background:var(--bg); }
  /* 관리비 탭은 화면이 위아래로 스크롤/바운스되지 않도록 완전히 고정한다. */
  body.mp-lock-scroll{ height:100vh; height:100dvh; overflow:hidden; }
  body.mp-lock-scroll #mp-root{ height:100vh; height:100dvh; min-height:0; }
  body.mp-lock-scroll .mp-main{ overflow:hidden; }
  /* .mp-main에 overflow:hidden이 붙으면 그 안의 position:sticky 요소는 뷰포트가 아니라
     .mp-main 자신을 기준으로 top 오프셋을 다시 적용해서 엉뚱하게 아래로 밀려난다.
     관리비 탭은 어차피 스크롤이 없어 sticky가 필요 없으니 그냥 꺼서 원래 자리에 둔다. */
  body.mp-lock-scroll .mp-tab-sticky{ position:static; }

  #mp-root{
    font-family:var(--font-ui);
    color:var(--ink);
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .mp-header{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:max(20px, env(safe-area-inset-top)) 20px 12px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .mp-header .mp-date{
    font-size:.86rem; color:var(--ink); font-weight:700; letter-spacing:-0.01em; flex-shrink:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mp-header-actions{ display:flex; gap:5px; flex-shrink:0; }
  .mp-reset-btn{
    font-family:var(--font-ui); background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:5px 9px; font-size:.68rem; font-weight:650; cursor:pointer; flex-shrink:0;
    white-space:nowrap;
  }
  .mp-reset-btn:hover{ color:var(--negative); border-color:var(--negative); }
  #mp-sync-btn.is-paired{ color:var(--positive); border-color:var(--positive); }

  .mp-sync-overlay{
    position:fixed; inset:0; z-index:20; background:rgba(24,28,34,.4);
    display:flex; align-items:flex-end; justify-content:center;
    animation: mp-reveal .18s ease;
  }
  .mp-sync-modal{
    background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px 20px max(20px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
    max-height:80vh; overflow-y:auto;
  }
  .mp-sync-head{ display:flex; align-items:center; justify-content:space-between; }
  .mp-sync-title{ font-size:1.05rem; font-weight:800; }
  .mp-sync-close{ background:none; border:none; color:var(--muted); font-size:1.2rem; cursor:pointer; padding:2px 6px; }
  .mp-sync-desc{ font-size:.82rem; color:var(--muted); line-height:1.5; }
  .mp-sync-code-display{
    font-size:2rem; font-weight:800; letter-spacing:.15em; text-align:center;
    font-variant-numeric:tabular-nums; padding:16px; background:var(--surface-alt); border-radius:var(--radius-md);
    color:var(--accent);
  }
  .mp-sync-status{ font-size:.76rem; color:var(--muted); text-align:center; }
  .mp-sync-status.err{ color:var(--negative); }
  .mp-sync-divider{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.74rem; margin:2px 0; }
  .mp-sync-divider::before, .mp-sync-divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  .mp-sync-join-form{ display:flex; gap:8px; }
  .mp-sync-join-form input{
    flex:1; text-align:center; letter-spacing:.2em; font-variant-numeric:tabular-nums; font-size:1rem;
  }

  .mp-main{ flex:1; padding:14px 16px 104px; display:flex; flex-direction:column; gap:12px; }
  .mp-main.mp-util-tight-top{ padding-top:4px; }

  .mp-tab-sticky{
    position:sticky; top:var(--mp-header-h, 60px); z-index:4;
    background:var(--bg); display:flex; flex-direction:column; gap:12px;
    padding-top:2px; padding-bottom:2px; margin-top:-2px;
  }

  .mp-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px;
  }

  .mp-card + .mp-card{ margin-top:0; }

  .mp-hero{ padding:20px 18px; }
  .mp-hero .mp-total{ color:var(--ink); }

  .mp-label{
    font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  }

  .mp-total{
    font-size:2.1rem; font-weight:800; letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    margin-top:4px;
  }
  .mp-total.neg{ color:var(--negative); }
  .mp-total.pos{ color:var(--ink); }

  .mp-sub{ font-size:.85rem; color:var(--muted); margin-top:2px; }

  /* account cards */
  .mp-accounts-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .mp-savings-grid{
    grid-template-columns:repeat(3, 1fr); gap:8px;
  }
  .mp-savings-grid .mp-account:not(.is-expanded){
    aspect-ratio:auto; overflow:hidden; border-radius:var(--radius-md);
    border:1px solid var(--line); border-left:3px solid var(--acc-color, var(--accent));
    padding:8px 6px; justify-content:center; cursor:pointer; gap:0;
  }
  .mp-savings-grid .mp-account:not(.is-expanded) .mp-account-name{ font-size:.72rem; white-space:nowrap; }
  .mp-savings-grid .mp-account:not(.is-expanded) .mp-balance-label{ font-size:.5rem; margin-top:2px; }
  .mp-savings-grid .mp-account:not(.is-expanded) .mp-account-total{ font-size:.66rem; margin-top:1px; }
  .mp-account{
    background:var(--surface); border:1px solid var(--line);
    border-left-width:4px; border-left-style:solid; border-left-color:var(--acc-color, var(--accent));
    border-radius:var(--radius-lg);
    padding:14px 16px; display:flex; flex-direction:column; gap:8px;
  }
  .mp-account:not(.is-expanded){
    aspect-ratio:1/1; overflow:hidden; border-radius:50%;
    border:3px solid var(--acc-color, var(--accent));
    padding:14%; justify-content:center; cursor:pointer;
  }
  .mp-color-swatch{
    -webkit-appearance:none; appearance:none; width:22px; height:22px; flex-shrink:0;
    border:1px solid var(--line); border-radius:6px; padding:0; background:none; cursor:pointer;
  }
  .mp-color-swatch::-webkit-color-swatch-wrapper{ padding:2px; }
  .mp-color-swatch::-webkit-color-swatch{ border:none; border-radius:4px; }
  .mp-account-name-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; }
  .mp-account-name{ font-size:.88rem; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mp-account:not(.is-expanded) .mp-account-name{ white-space:normal; overflow:visible; font-size:.82rem; }
  .mp-edit-icon{ font-size:.88rem; padding:4px 7px; flex-shrink:0; }
  .mp-account-purpose{ font-size:.72rem; color:var(--muted); }
  .mp-account-number{
    font-size:.74rem; color:var(--muted); border:none; background:none;
    padding:2px 0; width:100%; font-variant-numeric:tabular-nums; flex:1; min-width:0;
  }
  .mp-account-purpose-input, .mp-account-name-input{
    font-size:.82rem; color:var(--ink); border:none; background:none; padding:2px 0; width:100%;
  }
  .mp-account-number-row{ display:flex; align-items:center; gap:6px; }
  .mp-detail-field{ display:flex; flex-direction:column; gap:2px; }
  .mp-fixed-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mp-fixed-list{ display:flex; flex-direction:column; gap:0; margin-top:2px; }
  .mp-fixed-row{
    display:grid; grid-template-columns:36px 1fr auto auto auto; gap:8px; align-items:center;
    padding:7px 0; border-top:1px solid var(--line); font-size:.82rem;
  }
  .mp-fixed-day{ font-size:.78rem; color:var(--muted); font-weight:650; white-space:nowrap; }
  .mp-fixed-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mp-fixed-amt{ font-variant-numeric:tabular-nums; font-weight:650; white-space:nowrap; }
  .mp-fixed-add{ display:grid; grid-template-columns:56px 1fr 100px auto; gap:6px; margin-top:8px; }
  .mp-fixed-add input, .mp-fixed-edit input{ width:100%; }
  .mp-fixed-edit{ display:grid; grid-template-columns:56px 1fr 100px auto auto; gap:6px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .mp-fixed-month{ font-size:.78rem; color:var(--muted); font-weight:650; white-space:nowrap; }
  .mp-annual-row{ grid-template-columns:36px 1fr auto auto auto; }
  /* 개인 탭 고정지출: 일/내용/금액을 아이콘 없이 바로 탭해서 수정하는 행 */
  .mp-fixed-row-editable{ grid-template-columns:30px 1fr 78px 22px; }
  .mp-fixed-row-editable input{
    border:none; background:none; padding:2px 0; font-size:.8rem; font-family:var(--font-ui);
    color:var(--ink); height:auto; border-radius:4px; width:100%;
  }
  .mp-fixed-row-editable input:focus{ background:var(--surface-alt); padding:2px 4px; outline:none; }
  .mp-fixed-day-edit{ color:var(--muted); font-weight:650; text-align:center; }
  .mp-fixed-name-edit{ overflow:hidden; text-overflow:ellipsis; }
  .mp-fixed-amt-edit{ font-variant-numeric:tabular-nums; font-weight:650; text-align:right; }
  .mp-fixed-row-editable .mp-icon-btn{ padding:2px; justify-self:end; }
  .mp-annual-add{ display:grid; grid-template-columns:56px 1fr 100px auto; gap:6px; margin-top:8px; }
  .mp-annual-add input, .mp-annual-edit input, .mp-annual-add select, .mp-annual-edit select{ width:100%; }
  .mp-annual-edit{ display:grid; grid-template-columns:56px 1fr 100px auto auto; gap:6px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .mp-loan-meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .mp-loan-stats{ font-size:.78rem; color:var(--muted); margin-top:10px; }
  .mp-loan-stats b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .mp-loan-input{ width:100%; }
  .mp-util-chart-tabs{ display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .mp-util-chart-tabs .mp-sort-btn{ flex-shrink:0; }
  .mp-util-chart-wrap{ width:100%; overflow-x:auto; margin-top:10px; -webkit-overflow-scrolling:touch; }
  .mp-util-chart{ display:block; height:130px; }
  .mp-account-balance{ font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .mp-account-balance.neg{ color:var(--negative); }
  .mp-account-body{
    display:flex; flex-direction:column; align-items:flex-start;
    gap:1px;
  }
  .mp-account:not(.is-expanded) .mp-account-body{
    align-items:center; text-align:center;
  }
  .mp-balance-label{
    font-size:.62rem; color:var(--muted); font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    margin-top:4px;
  }
  .mp-account:not(.is-expanded) .mp-balance-label{ font-size:.55rem; margin-top:6px; }
  .mp-account-body .mp-balance-edit{
    font-size:1.2rem; font-weight:700; border:none; background:none; padding:2px 0; width:100%;
  }
  .mp-account:not(.is-expanded) .mp-balance-edit{ font-size:.92rem; text-align:center; }
  .mp-balance-input-row{ display:flex; align-items:center; gap:3px; min-width:0; width:100%; }
  .mp-balance-input-row .mp-balance-edit, .mp-balance-input-row .mp-loan-input{ flex:0 1 auto; min-width:0; width:auto; }
  .mp-balance-suffix{ font-size:1.05rem; font-weight:700; color:var(--ink); flex-shrink:0; }
  .mp-balance-row{ display:flex; align-items:flex-end; gap:10px; width:100%; }
  .mp-balance-field{ display:flex; flex-direction:column; flex:1; min-width:0; }
  /* 생활비 탭 기준금액 입력칸은 전역 input 규칙 때문에 높이가 38px로 고정되는데,
     옆의 "이번 달 생활비" 값은 일반 div라 글자 높이만큼만 차지해서 둘의 높이가 달랐다.
     같은 38px로 맞춰서 나란히 놓였을 때 높이가 어긋나거나 잘려 보이지 않게 한다. */
  .mp-balance-row .mp-total{ margin-top:0; height:38px; line-height:38px; }
  .mp-account-total{ font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; padding:2px 0; }
  .mp-account-total.neg{ color:var(--negative); }
  .mp-account:not(.is-expanded) .mp-balance-row{ flex-direction:column; align-items:center; gap:6px; }
  .mp-account:not(.is-expanded) .mp-balance-field{ align-items:center; }
  .mp-account:not(.is-expanded) .mp-account-total{ font-size:.9rem; text-align:center; }
  .mp-tools-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .mp-fixed-toggle-btn{
    font-family:var(--font-ui); background:var(--surface-alt); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; font-size:.72rem; font-weight:650; cursor:pointer;
  }
  .mp-fixed-toggle-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); }
  .mp-account-settings-panel{ display:flex; flex-direction:column; gap:10px; }
  .mp-account-detail{
    display:flex; flex-direction:column; gap:10px;
    margin-top:2px; padding-top:10px; border-top:1px solid var(--line);
  }
  .mp-account-settings-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mp-icon-btn{
    background:none; border:none; color:var(--muted); font-size:.78rem; padding:4px 6px;
    border-radius:var(--radius-sm); cursor:pointer;
  }
  .mp-icon-btn:hover{ background:var(--surface-alt); color:var(--ink); }
  .mp-icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  input[type="number"], input[type="text"], input[type="date"], select{
    font-family:var(--font-ui);
    background:var(--surface-alt);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:var(--radius-sm);
    padding:8px 10px;
    font-size:.85rem;
    font-variant-numeric:tabular-nums;
    height:38px;
    box-sizing:border-box;
    line-height:20px;
  }
  select{ padding:8px 6px; }
  input[type="date"]{
    -webkit-appearance:none; appearance:none;
    background:var(--surface-alt); border:1px solid var(--line); color:var(--ink);
  }

  input.mp-account-number{ background:none; border:none; padding:2px 0; border-radius:0; }
  input.mp-account-number:focus{ outline:none; border-bottom:1.5px solid var(--accent); }

  .mp-btn{
    font-family:var(--font-ui);
    background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:999px; padding:9px 16px; font-size:.85rem; font-weight:700;
    cursor:pointer; white-space:nowrap;
  }
  .mp-btn.ghost{
    background:none; color:var(--accent); border:1.5px solid var(--line);
  }
  .mp-btn.block{ width:100%; padding:11px; }
  .mp-btn.small{ padding:6px 12px; font-size:.78rem; }

  .mp-log-toggle{ font-size:.78rem; color:var(--accent); background:none; border:none; cursor:pointer; text-align:left; padding:0; font-weight:600; }
  .mp-log{ display:flex; flex-direction:column; margin-top:2px; }
  .mp-sort-toggle{ display:flex; gap:6px; }
  .mp-sort-btn{
    font-family:var(--font-ui); background:var(--surface-alt); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; font-size:.72rem; font-weight:650; cursor:pointer;
  }
  .mp-sort-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); }
  .mp-tx-edit{
    display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px 0; border-top:1px solid var(--line);
    width:100%; box-sizing:border-box;
  }
  .mp-tx-edit > *{ min-width:0; }
  .mp-tx-edit select, .mp-tx-edit input{ height:32px; box-sizing:border-box; padding:0 8px; width:100%; font-size:.82rem; }
  .mp-tx-edit .mp-tx-edit-actions{ grid-column:1 / -1; display:flex; gap:6px; justify-content:flex-end; }

  /* month switcher */
  .mp-month-switch{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 2px 4px;
  }
  .mp-month-switch .mp-month-label{ font-weight:800; font-size:1.05rem; letter-spacing:-0.01em; }
  .mp-month-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:32px; height:32px; border-radius:50%; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .mp-month-picker{
    display:flex; gap:6px; align-items:center; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-md);
    padding:10px; margin-bottom:2px;
  }
  .mp-month-picker select{ flex:1; min-width:0; }

  /* progress bar */
  .mp-progress{ height:6px; border-radius:99px; background:var(--surface-alt); overflow:hidden; margin-top:10px; }
  .mp-progress > div{ height:100%; border-radius:99px; background:var(--accent); }
  .mp-progress.warn > div{ background:var(--warning); }
  .mp-progress.over > div{ background:var(--negative); }
  .mp-carry-btn{ margin-top:12px; }

  .mp-tx-list{ display:flex; flex-direction:column; }
  .mp-tx-row{
    display:grid; grid-template-columns:38px 1fr 84px auto; gap:6px; align-items:center;
    padding:9px 0; border-top:1px solid var(--line); font-size:.85rem;
  }
  .mp-tx-row > *{ min-width:0; }
  .mp-tx-row .mp-tx-date{ color:var(--muted); font-size:.72rem; font-variant-numeric:tabular-nums; }
  .mp-tx-row .mp-tx-memo{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mp-tx-row .mp-tx-amt{ font-variant-numeric:tabular-nums; font-weight:650; color:var(--negative); white-space:nowrap; text-align:right; }
  .mp-tx-row .mp-tx-amt.income{ color:var(--positive); }
  /* 개인 탭: 날짜/내역/금액을 아이콘 없이 바로 탭해서 수정하는 행 (기준잔액과 같은 방식) */
  .mp-tx-row-editable{ grid-template-columns:76px 1fr 78px 24px; }
  .mp-tx-row-editable input{
    border:none; background:none; padding:2px 0; font-size:.8rem; font-family:var(--font-ui);
    color:var(--ink); height:auto; border-radius:4px;
  }
  .mp-tx-row-editable input:focus{ background:var(--surface-alt); padding:2px 4px; outline:none; }
  .mp-tx-row-editable .mp-tx-date-edit{ color:var(--muted); font-size:.72rem; font-variant-numeric:tabular-nums; }
  .mp-tx-row-editable .mp-tx-memo-edit{ overflow:hidden; text-overflow:ellipsis; }
  .mp-tx-row-editable .mp-tx-amount-edit{ font-variant-numeric:tabular-nums; font-weight:650; color:var(--negative); text-align:right; }
  .mp-tx-row-editable .mp-tx-amount-edit.income{ color:var(--positive); }
  .mp-tx-row-editable .mp-icon-btn{ padding:2px; justify-self:end; }
  .mp-log-card{ padding:6px 16px; margin-top:4px; }
  .mp-log-card .mp-log{ margin-top:0; }
  .mp-log-card .mp-empty{ padding:16px 0; }
  .mp-tx-add, .mp-tx-add-personal{
    display:grid; grid-template-columns:42px 96px 1fr 50px auto; gap:6px; margin-top:10px; align-items:center;
  }
  .mp-tx-add > *, .mp-tx-add-personal > *{ min-width:0; }
  .mp-tx-add select, .mp-tx-add input, .mp-tx-add-personal select, .mp-tx-add-personal input{
    padding:0 4px; font-size:.72rem; height:32px; box-sizing:border-box;
  }
  .mp-tx-add .mp-btn, .mp-tx-add-personal .mp-btn{ padding:0 8px; font-size:.74rem; height:32px; box-sizing:border-box; }
  .mp-savings-tx-add{
    display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:6px; margin-top:10px; align-items:center;
  }
  .mp-savings-tx-add > *{ min-width:0; }
  .mp-savings-tx-add input{ padding:0 6px; font-size:.74rem; height:32px; box-sizing:border-box; width:100%; }
  .mp-savings-tx-add .mp-btn{ padding:0 8px; font-size:.74rem; height:32px; box-sizing:border-box; }

  .mp-empty{ color:var(--muted); font-size:.82rem; padding:10px 0; text-align:center; }

  /* tab bar */
  .mp-tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    max-width:480px; margin:0 auto;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; gap:6px; padding:10px 12px max(10px, env(safe-area-inset-bottom));
  }
  .mp-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--muted); font-family:var(--font-ui);
    font-size:.68rem; font-weight:650; padding:7px 2px; cursor:pointer; position:relative;
  }
  .mp-tab .mp-tab-icon{
    width:34px; height:24px; display:flex; align-items:center; justify-content:center;
  }
  .mp-tab.active{ color:var(--accent); }
  .mp-tab.active::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--accent);
  }
  .mp-tab svg{ width:21px; height:21px; }

  .mp-add-account-form{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .mp-add-account-form input{ min-width:110px; }

  .mp-personal-top-row{ display:flex; align-items:center; gap:8px; }
  .mp-personal-top-row > *:first-child{ flex:1; min-width:0; }

  .mp-lock-screen{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:40px 20px; }
  .mp-lock-icon{ font-size:2.4rem; }
  .mp-lock-form{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; margin-top:6px; }
  .mp-pw-form{ display:flex; flex-direction:column; gap:8px; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="mp-root">
  <header class="mp-header" id="mp-header">
    <div class="mp-date" id="mp-headerdate"></div>
    <div class="mp-header-actions">
      <button class="mp-reset-btn" id="mp-sync-btn" data-action="toggle-sync-panel" type="button">동기화</button>
      <button class="mp-reset-btn" data-action="export-data" type="button">내보내기</button>
      <button class="mp-reset-btn" data-action="trigger-import" type="button">가져오기</button>
      <button class="mp-reset-btn" id="mp-reset-btn" data-action="reset-tab" type="button">초기화</button>
    </div>
    <input type="file" id="mp-import-input" accept="application/json,.json" style="display:none;">
  </header>
  <div id="mp-sync-panel"></div>
  <div id="mp-password-panel"></div>
  <main class="mp-main" id="mp-main"></main>
  <nav class="mp-tabbar">
    <button class="mp-tab" data-tab="personal">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg></span>
      개인
    </button>
    <button class="mp-tab" data-tab="living">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="4" width="15" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg></span>
      생활비
    </button>
    <button class="mp-tab" data-tab="family">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12c0-3.5 3-6.5 8-6.5 3 0 5 1 6.5 2.5L20 6.5V11l-1.7.5c.2.6.2 1.3.2 2 0 3.5-3 6-8 6s-6.5-2-6.5-2"/><path d="M9 9.2h.01"/><path d="M4 13.5 2.5 15" /><path d="M7 17.5 6 19.5M11 18l-.5 2"/></svg></span>
      저축
    </button>
    <button class="mp-tab" data-tab="loan">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.3"/><circle cx="17.5" cy="17.5" r="2.3"/></svg></span>
      대출
    </button>
    <button class="mp-tab" data-tab="utility">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 21V9l6-4 6 4v12"/><path d="M10 21v-6h4v6"/><path d="M9 12h.01M15 12h.01M9 8.5h.01M15 8.5h.01"/></svg></span>
      관리비
    </button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  var STORAGE_KEY = "mp_data_v1";
  var todayISO = new Date().toISOString().slice(0,10);
  var currentMonthKey = todayISO.slice(0,7);

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function defaultState(){
    return {
      activeTab: "personal",
      currentMonth: currentMonthKey,
      accounts: [],
      logs: {},
      savings: {},
      savingsExpenses: [],
      living: {},
      loans: [],
      utilities: {},
      personalPasswordHash: ""
    };
  }

  function migrateReflectedFlags(s){
    (s.accounts || []).forEach(function(a){
      if(!Array.isArray(a.fixedExpenses)) a.fixedExpenses = [];
    });
    (s.loans || []).forEach(function(l){
      if(typeof l.originalAmount !== "number") l.originalAmount = 0;
      if(typeof l.startDate !== "string") l.startDate = "";
      if(typeof l.currentInstallment !== "number"){
        var maxInstallment = 0;
        if(Array.isArray(l.log)){
          l.log.forEach(function(t){ maxInstallment = Math.max(maxInstallment, Number(t.installment||0)); });
        }
        l.currentInstallment = maxInstallment;
      }
      delete l.log;
      delete l.color;
      delete l.balance;
    });
    return s;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      var merged = Object.assign(d, parsed, {
        accounts: parsed.accounts || d.accounts,
        logs: parsed.logs || {},
        savings: parsed.savings || {},
        savingsExpenses: parsed.savingsExpenses || [],
        living: parsed.living || {},
        loans: parsed.loans || [],
        utilities: parsed.utilities || {}
      });
      migrateReflectedFlags(merged);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
      return merged;
    }catch(e){
      return defaultState();
    }
  }

  var state = loadState();
  // 앱을 새로 열 때마다(완전히 종료 후 재실행 포함) 생활비/관리비/저축 탭이 오늘이 포함된
  // 달로 시작하도록 리셋한다. 이후 세션 중에는 탭을 오가도 이동했던 달이 유지된다
  // (탭 클릭 핸들러에서는 더 이상 이 값을 건드리지 않기 때문).
  state.currentMonth = new Date().toISOString().slice(0,7);

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    localStorage.setItem(SYNC_UPDATED_KEY, new Date().toISOString());
    scheduleCloudPush();
  }

  // ---------- 클라우드 동기화 (Supabase) ----------
  var SUPABASE_URL = "https://xjagznqrkhktepgoiorm.supabase.co";
  var SUPABASE_KEY = "sb_publishable_-BdzLRLLU-YsilxbAlgqMQ_Lj-UtwYb";
  var SYNC_CODE_KEY = "mp_sync_code";
  var SYNC_UPDATED_KEY = "mp_last_saved_at";
  var supabaseClient = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  var syncStatus = { syncing:false, lastSyncedAt:null, error:null };
  var pushDebounceTimer = null;
  var lastPushedSnapshot = null;
  var realtimeChannel = null;

  function getSyncCode(){ return localStorage.getItem(SYNC_CODE_KEY) || ""; }
  function setSyncCode(code){
    if(code) localStorage.setItem(SYNC_CODE_KEY, code);
    else localStorage.removeItem(SYNC_CODE_KEY);
  }
  function generateSyncCode(){
    return String(Math.floor(100000 + Math.random() * 900000));
  }

  function scheduleCloudPush(){
    if(!getSyncCode() || !supabaseClient) return;
    clearTimeout(pushDebounceTimer);
    pushDebounceTimer = setTimeout(pushStateToCloud, 800);
  }

  function pushStateToCloud(){
    var code = getSyncCode();
    if(!code || !supabaseClient) return;
    syncStatus.syncing = true;
    renderSyncPanel();
    var snapshot = JSON.stringify(state);
    var nowIso = new Date().toISOString();
    supabaseClient.from("sync_data")
      .upsert({ code: code, data: state, updated_at: nowIso })
      .then(function(res){
        syncStatus.syncing = false;
        if(res.error){
          syncStatus.error = res.error.message;
        } else {
          syncStatus.error = null;
          syncStatus.lastSyncedAt = new Date();
          lastPushedSnapshot = snapshot;
        }
        renderSyncPanel();
      });
  }

  function applyRemoteState(remoteData){
    var d = defaultState();
    var merged = Object.assign(d, remoteData, {
      accounts: remoteData.accounts || d.accounts,
      logs: remoteData.logs || {},
      savings: remoteData.savings || {},
      savingsExpenses: remoteData.savingsExpenses || [],
      living: remoteData.living || {},
      loans: remoteData.loans || [],
      utilities: remoteData.utilities || {},
      // 어느 탭/몇 월을 보고 있는지는 기기별 화면 상태일 뿐이라 동기화 대상이 아니다.
      // 원격 갱신을 받아도 지금 보고 있는 탭/월은 그대로 유지한다 (안 그러면 다른 기기나
      // 남아있던 탭이 저축 탭에 있을 때 실시간 갱신이 올 때마다 현재 화면이 그쪽으로 튕겨나간다).
      activeTab: state.activeTab,
      currentMonth: state.currentMonth
    });
    migrateReflectedFlags(merged);
    // 개인 탭 잠금 화면에서 비밀번호를 입력하는 도중에는 다시 그리지 않는다.
    // render()는 main.innerHTML을 통째로 새로 만들기 때문에, 마침 그 사이에 다른 기기의
    // 동기화 갱신이 들어오면 입력 중이던 비밀번호 칸이 빈 칸으로 초기화돼 버린다.
    // 데이터는 그대로 반영해 두고, 화면은 잠금 화면을 벗어난 뒤 자연스럽게 최신 상태로 그려지게 한다.
    var onPersonalLockScreen = state.activeTab === "personal" && state.personalPasswordHash && !personalUnlocked;
    state = merged;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    localStorage.setItem(SYNC_UPDATED_KEY, new Date().toISOString());
    if(!onPersonalLockScreen) render();
  }

  function subscribeRealtime(){
    if(!supabaseClient) return;
    var code = getSyncCode();
    if(!code) return;
    if(realtimeChannel){ supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
    realtimeChannel = supabaseClient.channel("sync_data_" + code)
      .on("postgres_changes", { event: "*", schema: "public", table: "sync_data", filter: "code=eq." + code }, function(payload){
        if(!payload.new || !payload.new.data) return;
        var incoming = JSON.stringify(payload.new.data);
        if(incoming === lastPushedSnapshot) return;
        lastPushedSnapshot = incoming;
        applyRemoteState(payload.new.data);
      })
      .subscribe();
  }

  function unsubscribeRealtime(){
    if(supabaseClient && realtimeChannel){ supabaseClient.removeChannel(realtimeChannel); }
    realtimeChannel = null;
  }

  function createSyncCode(){
    if(!supabaseClient){ syncStatus.error = "동기화 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요."; renderSyncPanel(); return; }
    var code = generateSyncCode();
    syncStatus.syncing = true;
    renderSyncPanel();
    supabaseClient.from("sync_data").upsert({ code: code, data: state, updated_at: new Date().toISOString() })
      .then(function(res){
        syncStatus.syncing = false;
        if(res.error){
          syncStatus.error = res.error.message;
          renderSyncPanel();
          return;
        }
        setSyncCode(code);
        syncStatus.error = null;
        syncStatus.lastSyncedAt = new Date();
        lastPushedSnapshot = JSON.stringify(state);
        subscribeRealtime();
        renderSyncPanel();
      });
  }

  function joinSyncCode(code){
    if(!supabaseClient){ uiFlags.syncJoinError = "동기화 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요."; renderSyncPanel(); return; }
    uiFlags.syncJoinError = "";
    syncStatus.syncing = true;
    renderSyncPanel();
    supabaseClient.from("sync_data").select("*").eq("code", code).maybeSingle()
      .then(function(res){
        syncStatus.syncing = false;
        if(res.error || !res.data){
          uiFlags.syncJoinError = "해당 코드를 찾을 수 없어요. 코드를 다시 확인해주세요.";
          renderSyncPanel();
          return;
        }
        setSyncCode(code);
        lastPushedSnapshot = JSON.stringify(res.data.data);
        applyRemoteState(res.data.data);
        syncStatus.error = null;
        syncStatus.lastSyncedAt = new Date();
        subscribeRealtime();
        renderSyncPanel();
      });
  }

  function unpairSync(){
    unsubscribeRealtime();
    setSyncCode("");
    syncStatus = { syncing:false, lastSyncedAt:null, error:null };
    renderSyncPanel();
  }

  function relativeTimeKo(date){
    if(!date) return "";
    var sec = Math.max(0, Math.floor((Date.now() - date.getTime())/1000));
    if(sec < 5) return "방금 전";
    if(sec < 60) return sec + "초 전";
    var min = Math.floor(sec/60);
    if(min < 60) return min + "분 전";
    var hr = Math.floor(min/60);
    if(hr < 24) return hr + "시간 전";
    return Math.floor(hr/24) + "일 전";
  }

  function renderSyncPanel(){
    var panel = document.getElementById("mp-sync-panel");
    var syncBtn = document.getElementById("mp-sync-btn");
    if(!panel) return;
    var code = getSyncCode();
    if(syncBtn) syncBtn.classList.toggle("is-paired", !!code);
    if(!uiFlags.showSync){ panel.innerHTML = ""; return; }

    var body;
    if(code){
      body =
        '<div class="mp-sync-desc">이 코드를 다른 기기의 "동기화" 메뉴에서 입력하면 데이터가 실시간으로 연결돼요.</div>' +
        '<div class="mp-sync-code-display">' + code.slice(0,3) + ' ' + code.slice(3) + '</div>' +
        '<div class="mp-sync-status' + (syncStatus.error ? ' err' : '') + '">' +
          (syncStatus.syncing ? '동기화 중…' : (syncStatus.error ? '동기화 실패: ' + esc(syncStatus.error) : (syncStatus.lastSyncedAt ? '마지막 동기화: ' + relativeTimeKo(syncStatus.lastSyncedAt) : '아직 동기화 전이에요'))) +
        '</div>' +
        '<button type="button" class="mp-btn ghost block" data-action="sync-now">지금 동기화</button>' +
        '<button type="button" class="mp-btn ghost block" data-action="unpair-sync" style="color:var(--negative);">연결 해제</button>';
    } else {
      body =
        '<div class="mp-sync-desc">코드 없이 로그인 없이, 6자리 코드만으로 다른 기기와 실시간 동기화할 수 있어요. 저장할 때마다 인터넷이 필요해요.</div>' +
        '<button type="button" class="mp-btn block" data-action="create-sync-code">새 코드 만들기</button>' +
        '<div class="mp-sync-divider">또는</div>' +
        '<form class="mp-sync-join-form" data-action="join-sync-code">' +
          '<input type="text" inputmode="numeric" name="code" placeholder="6자리 코드 입력" maxlength="6" required>' +
          '<button type="submit" class="mp-btn">연결하기</button>' +
        '</form>' +
        (uiFlags.syncJoinError ? '<div class="mp-sync-status err">' + esc(uiFlags.syncJoinError) + '</div>' : '') +
        (syncStatus.syncing ? '<div class="mp-sync-status">연결하는 중…</div>' : '');
    }

    panel.innerHTML =
      '<div class="mp-sync-overlay" data-action="close-sync-panel">' +
        '<div class="mp-sync-modal" data-action="noop-stop">' +
          '<div class="mp-sync-head">' +
            '<div class="mp-sync-title">동기화</div>' +
            '<button type="button" class="mp-sync-close" data-action="close-sync-panel">✕</button>' +
          '</div>' +
          body +
        '</div>' +
      '</div>';
  }

  function renderPasswordModal(){
    var panel = document.getElementById("mp-password-panel");
    if(!panel) return;
    if(!uiFlags.showPasswordSetup){ panel.innerHTML = ""; return; }
    var hasPw = !!state.personalPasswordHash;
    var mode = uiFlags.passwordModalMode || (hasPw ? "menu" : "set");
    var body = "";
    if(mode === "menu"){
      body =
        '<div class="mp-sync-desc">개인 탭에 비밀번호가 설정되어 있어요.</div>' +
        '<button type="button" class="mp-btn ghost block" data-action="password-mode-change">비밀번호 변경</button>' +
        '<button type="button" class="mp-btn ghost block" data-action="password-mode-remove" style="color:var(--negative);">비밀번호 해제</button>';
    } else if(mode === "set"){
      body =
        '<div class="mp-sync-desc">개인 탭에 들어갈 때 입력할 비밀번호를 설정해요 (4자 이상).</div>' +
        '<form class="mp-pw-form" data-action="submit-set-password">' +
          '<input type="text" inputmode="numeric" pattern="[0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false" style="-webkit-text-security:disc;" name="newcode1" placeholder="새 비밀번호" autocomplete="off" data-lpignore="true" data-1p-ignore required>' +
          '<input type="text" inputmode="numeric" pattern="[0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false" style="-webkit-text-security:disc;" name="newcode2" placeholder="새 비밀번호 확인" autocomplete="off" data-lpignore="true" data-1p-ignore required>' +
          '<button type="submit" class="mp-btn block">설정하기</button>' +
        '</form>';
    } else if(mode === "change"){
      body =
        '<form class="mp-pw-form" data-action="submit-change-password">' +
          '<input type="text" inputmode="numeric" pattern="[0-9]*" autocapitalize="off" autocorrect="off" spellcheck="false" style="-webkit-text-security:disc;" name="curcode" placeholder="현재 비밀번호" autocomplete="off" data-lpignore="true" data-1p-ignore required>' +

  function sha256Hex(text){
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });

  function accountTotal(acc){
    // 총 보유자산은 기준 잔액에 모든 지출/입금 내역이 더해지고 빠진 값이다.
    var log = getLog(acc.id);
    var delta = log.reduce(function(s,t){

  function loanRepaid(loan){
    return Number(loan.currentInstallment||0) * Number(loan.monthlyPayment||0);
  }
  function loanRemaining(loan){
    return Number(loan.originalAmount||0) - loanRepaid(loan);
  }
  function loanTotalInstallments(loan){
    var mp = Number(loan.monthlyPayment||0);
    if(mp <= 0) return 0;
    return Math.ceil(Number(loan.originalAmount||0) / mp);
  }
  function loanRemainingInstallments(loan){
    var t = loanTotalInstallments(loan);
    if(t <= 0) return 0;
    return Math.max(0, t - Number(loan.currentInstallment||0));
  }
  function fmtDateDots(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length !== 3) return iso;
    return p[0] + "." + p[1] + "." + p[2];
  }
  function parseDotDateToISO(str){
    var digits = String(str||"").replace(/[^0-9]/g, "").slice(0,8);
    if(digits.length < 8) return null;
    var y = digits.slice(0,4);
    var mo = Math.min(12, Math.max(1, parseInt(digits.slice(4,6),10) || 1));
    var da = Math.min(31, Math.max(1, parseInt(digits.slice(6,8),10) || 1));
    return y + "-" + String(mo).padStart(2,"0") + "-" + String(da).padStart(2,"0");
  }
  function formatDateDotsRaw(raw){
    var digits = String(raw||"").replace(/[^0-9]/g, "").slice(0,8);
    var parts = [];
    if(digits.length > 0) parts.push(digits.slice(0,4));
    if(digits.length > 4) parts.push(digits.slice(4,6));
    if(digits.length > 6) parts.push(digits.slice(6,8));
    return parts.join(".");
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function formatNumberString(raw){
    raw = String(raw == null ? "" : raw);
    var negative = /^\s*-/.test(raw);
    var digits = raw.replace(/[^0-9]/g, "").replace(/^0+(?=\d)/, "");
    if(digits === "") return negative ? "-" : "";
    return (negative ? "-" : "") + Number(digits).toLocaleString("ko-KR");
  }
  function moneyChWidth(raw, padded){
    // "ch" 단위는 숫자 0 하나의 폭을 기준으로 하는데, 콤마(,)는 실제로 그보다 훨씬 좁게
    // 그려진다. 글자 수를 그대로 ch로 쓰면 콤마 개수만큼 "원" 앞에 여백이 남으므로,
    // 콤마는 폭을 훨씬 작게 쳐서 숫자 옆에 "원"이 바짝 붙게 한다.
    // padded=true는 .mp-balance-edit처럼 테두리를 없앤 입력칸이 아니라, 기본 input
    // 패딩(좌우 10px씩)이 그대로 적용되는 필드(예: 저축금액/결산이자)용 - 그 여백만큼
    // ch를 더 얹지 않으면 숫자가 입력칸 안에서 잘려 보인다.
    var formatted = formatNumberString(raw);
    var commaCount = (formatted.match(/,/g) || []).length;
    var width = (formatted.length - commaCount) + commaCount * 0.55;
    if(padded) width += 3;
    return Math.max(4, width) + "ch";
  }

  function parseMoneyValue(raw){
    raw = String(raw == null ? "" : raw);
    var negative = /^\s*-/.test(raw);
    var digits = raw.replace(/[^0-9]/g, "");
    if(digits === "") return 0;
    return (negative ? -1 : 1) * Number(digits);
  }

  function focusPersonalLockInput(){
    var pwInput = document.querySelector('[data-action="unlock-personal"] input');
    if(!pwInput) return;
    pwInput.focus();
    // iOS Safari sometimes ignores focus() on an element that was just inserted via
    // innerHTML within the same tap handler. Retrying a beat later (still within the
    // same user gesture window) catches those cases without hurting the ones that
    // already worked synchronously.
    requestAnimationFrame(function(){
      var el = document.querySelector('[data-action="unlock-personal"] input');
      if(el) el.focus();
    });
  }

  function renderLiving(){
    var mk = state.currentMonth;
    var m = getLivingMonth(mk);
    var spent = m.tx.reduce(function(s,t){ return (t.type||"expense")==="expense" ? s + Number(t.amount||0) : s; }, 0);
    var received = m.tx.reduce(function(s,t){ return (t.type||"expense")==="income" ? s + Number(t.amount||0) : s; }, 0);
    var remain = Number(m.budget||0) - spent + received;
    var pct = m.budget > 0 ? Math.min(100,(spent/m.budget)*100) : (spent>0?100:0);

  // ---------- 관리비 탭 ----------
  function utilityChartHTML(currentKey, field){
    field = UTILITY_CHART_FIELDS[field] ? field : "total";
    // 실제로 값이 입력된 달(+지금 보고 있는 달)만 기준으로 범위를 잡는다. 그냥 넘겨보기만 한
    // 빈 달까지 범위에 들어가면 안 되므로 getUtilityMonth()로 자동 생성된 0원짜리 항목은 제외한다.
    // 항목(커뮤니티/전기료 등)을 선택해도 x축 범위는 전체 관리비 기준으로 그대로 유지해서
    // 항목을 바꿀 때마다 스크롤 범위가 널뛰지 않게 한다.
    var keysWithData = Object.keys(state.utilities || {}).filter(function(k){
      return utilityTotal(state.utilities[k]) > 0;
    });
    var boundary = keysWithData.concat([currentKey]).sort();
    var minKey = boundary[0];
    var maxKey = boundary[boundary.length - 1];

    function buildMonths(){
      var list = [];
      var cursor = minKey;
      var guard = 0;
      while(guard++ < 1200){
        list.push(cursor);
        if(cursor === maxKey) break;
        cursor = shiftMonth(cursor, 1);
      }
      return list;
    }
    var months = buildMonths();
    // 데이터가 몇 달 없을 때도 추세를 볼 수 있도록 최소 6개월 폭은 보여준다.
    while(months.length < 6){
      minKey = shiftMonth(minKey, -1);
      months = buildMonths();
    }

    var totals = months.map(function(mk){
      var m = state.utilities[mk];
      if(!m) return 0;
      return field === "total" ? utilityTotal(m) : Number(m[field]||0);
    });
    var max = Math.max.apply(null, totals.concat([1]));
    var stepPx = 54, h = 120, padTop = 20, padBottom = 22, padX = 26;
    var innerH = h - padTop - padBottom;
    var w = Math.max(300, padX * 2 + (months.length - 1) * stepPx);
    var stepX = months.length > 1 ? (w - padX * 2) / (months.length - 1) : 0;

    var points = totals.map(function(v, i){
      var x = padX + i * stepX;
      var y = padTop + innerH - (max > 0 ? (v / max) * innerH : 0);
      return { x: x, y: y, v: v, mk: months[i] };
    });

    var pathD = points.map(function(p, i){
      return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
    }).join(' ');

    var marks = points.map(function(p){
      var isCurrent = p.mk === currentKey;
      var mlabel = (p.mk.slice(0,4) !== currentKey.slice(0,4) ? p.mk.slice(2,4) + '.' : '') + parseInt(p.mk.slice(5,7), 10) + '월';
      return (p.v > 0 ?
          '<text x="' + p.x.toFixed(1) + '" y="' + (p.y - 8).toFixed(1) + '" font-size="7.5" fill="var(--muted)" text-anchor="middle">' + won(p.v).replace("원","") + '</text>'
        : '') +
        '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (isCurrent ? 4 : 3) + '" fill="' + (isCurrent ? 'var(--accent)' : 'var(--surface)') + '" stroke="var(--accent)" stroke-width="1.6"' + (isCurrent ? ' data-current="1"' : '') + '/>' +
        '<text x="' + p.x.toFixed(1) + '" y="' + (h - 6) + '" font-size="8.5" fill="' + (isCurrent ? 'var(--accent)' : 'var(--muted)') + '" font-weight="' + (isCurrent ? '700' : '400') + '" text-anchor="middle">' + mlabel + '</text>';
    }).join("");

    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" class="mp-util-chart" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      marks +
    '</svg>';
  }

  root.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.dataset.action;

    if(action === "toggle-sync-panel"){
      uiFlags.showSync = !uiFlags.showSync;
      uiFlags.syncJoinError = "";
      renderSyncPanel();
      return;
    }
    if(action === "close-sync-panel"){
      uiFlags.showSync = false;
      renderSyncPanel();
      return;
    }
    if(action === "noop-stop"){ return; }
    if(action === "create-sync-code"){
      createSyncCode();
      return;
    }
    if(action === "sync-now"){
      pushStateToCloud();
      return;
    }
    if(action === "unpair-sync"){
      if(!confirm("연결을 해제할까요? 이 기기의 데이터는 그대로 남아있고, 다른 기기와의 실시간 동기화만 멈춰요.")) return;
      unpairSync();
      return;
    }

    if(action === "toggle-password-setup"){
      uiFlags.showPasswordSetup = true;
      uiFlags.passwordModalMode = null;
      uiFlags.passwordError = "";
      renderPasswordModal();
      return;
    }
    if(action === "close-password-panel"){
      uiFlags.showPasswordSetup = false;
      renderPasswordModal();
      return;
    }
    if(action === "password-mode-change"){
      uiFlags.passwordModalMode = "change";
      uiFlags.passwordError = "";
      renderPasswordModal();
      return;
    }
    if(action === "password-mode-remove"){
      uiFlags.passwordModalMode = "remove";
      uiFlags.passwordError = "";
      renderPasswordModal();
      return;
    }

    if(action === "reset-tab"){
      var tabName = TAB_NAMES[state.activeTab] || "현재 탭";
      if(!confirm("정말 " + tabName + " 탭의 데이터를 모두 지우고 초기화할까요? 되돌릴 수 없어요.")) return;
      if(state.activeTab === "personal"){
        state.accounts = [];
        state.logs = {};
        state.personalPasswordHash = "";
        personalUnlocked = false;
        uiFlags.expandedAccounts = {};
        uiFlags.editingSettings = {};
        uiFlags.showFixed = {};
        uiFlags.showAddAccount = false;
      } else if(state.activeTab === "living"){
        state.living = {};
        uiFlags.showMonthPicker = false;
      } else if(state.activeTab === "family"){
        state.savings = {};
        state.savingsExpenses = [];
        uiFlags.showAnnualExpenses = false;
        uiFlags.editingAnnualExpense = null;
        uiFlags.editingSavingsTx = null;
        uiFlags.savingsExpanded = false;
      } else if(state.activeTab === "loan"){
        state.loans = [];
        uiFlags.expandedLoans = {};
        uiFlags.editingLoanSettings = {};
        uiFlags.showAddLoan = false;
      } else if(state.activeTab === "utility"){
        state.utilities = {};
      }
      saveState(); render();
      return;
    }

    if(action === "export-data"){
      var exportStr = localStorage.getItem(STORAGE_KEY) || JSON.stringify(state);
      var blob = new Blob([exportStr], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "moneyplanner-backup-" + todayISO + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return;
    }

    if(action === "trigger-import"){
      var fileInput = document.getElementById("mp-import-input");
      if(fileInput) fileInput.click();
      return;
    }

    if(action === "carry-over-next-month"){
      var srcKey = state.currentMonth;
      var srcMonth = getLivingMonth(srcKey);
      if(srcMonth.carriedOver){ alert("이미 이번 달 잔액을 다음 달로 이월했어요."); return; }
      var spentX = srcMonth.tx.reduce(function(s,t){ return (t.type||"expense")==="expense" ? s + Number(t.amount||0) : s; }, 0);
      var receivedX = srcMonth.tx.reduce(function(s,t){ return (t.type||"expense")==="income" ? s + Number(t.amount||0) : s; }, 0);
      var remainX = Number(srcMonth.budget||0) - spentX + receivedX;
      if(remainX <= 0){ alert("이월할 잔액이 없어요."); return; }
      if(!confirm(monthLabel(srcKey) + '의 잔액 ' + won(remainX) + '을(를) 다음 달로 이월할까요?')) return;
      var nextKey = shiftMonth(srcKey, 1);
      var nextMonth = getLivingMonth(nextKey);
      nextMonth.tx.push({
        id: uid(),
        date: lastDayOfMonth(srcKey),
        memo: monthLabel(srcKey) + ' 이월',
        amount: remainX,
        type: "income"
      });
      srcMonth.carriedOver = true;
      saveState(); render();
      return;
    }

    if(action === "toggle-fixed-list"){
      uiFlags.showFixed[el.dataset.id] = !uiFlags.showFixed[el.dataset.id];

      render();
      return;
    }
    if(action === "toggle-fixed-add-form"){

      render();
      return;
    }
    if(action === "copy-account-number"){
      var accCopy = state.accounts.find(function(a){ return a.id === el.dataset.id; });
      if(!accCopy || !accCopy.accountNumber) return;
      var text = accCopy.accountNumber;
      var fallbackCopy = function(){
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try{ document.execCommand("copy"); }catch(err){}
        document.body.removeChild(ta);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
      var original = el.textContent;
      el.textContent = "✓";
      setTimeout(function(){ el.textContent = original; }, 1200);
      return;
    }
    if(action === "toggle-annual-expenses"){

  root.addEventListener("input", function(e){
    var el = e.target;
    if(el.classList && el.classList.contains("mp-unlock-input")){
      var tryVal = el.value;
      if(tryVal.length >= 4){
        sha256Hex(tryVal).then(function(hash){
          if(hash === state.personalPasswordHash){
            personalUnlocked = true;
            uiFlags.passwordError = "";
            render();
          }
        });
      }
      return;
    }
    if(el.classList && el.classList.contains("mp-date-input")){
      var dCaret = el.selectionStart;
      var dOldVal = el.value;
      var dDigitsBefore = (dOldVal.slice(0, dCaret).match(/[0-9]/g) || []).length;
      var dFormatted = formatDateDotsRaw(dOldVal);
      el.value = dFormatted;
      var dCount = 0, dPos = dFormatted.length;
      for(var di=0; di<dFormatted.length; di++){
        if(/[0-9]/.test(dFormatted[di])) dCount++;
        if(dCount === dDigitsBefore){ dPos = di+1; break; }
      }
      if(dDigitsBefore === 0) dPos = 0;
      el.setSelectionRange(dPos, dPos);
      return;
    }
    if(el.dataset.action === "set-loan-installment"){
      liveUpdateLoanFromDOM(el.dataset.id);
      return;
    }
    if(!el.classList || !el.classList.contains("mp-money")) return;
    var caret = el.selectionStart;
    var oldVal = el.value;
    var digitsBefore = (oldVal.slice(0, caret).match(/[0-9]/g) || []).length;
    var negative = /^\s*-/.test(oldVal);
    var formatted = formatNumberString(oldVal);
    el.value = formatted;
    var count = 0, pos = formatted.length;
    for(var i=0;i<formatted.length;i++){
      if(/[0-9]/.test(formatted[i])) count++;
      if(count === digitsBefore){ pos = i+1; break; }
    }
    if(digitsBefore === 0) pos = (negative && formatted.charAt(0)==="-") ? 1 : 0;
    el.setSelectionRange(pos, pos);

    if(el.closest && el.closest(".mp-balance-input-row")){
      el.style.width = moneyChWidth(formatted, el.classList.contains("mp-loan-input"));
    }

    if(el.dataset.action === "set-utility-field"){
      var liveTotalEl = document.querySelector("#mp-main .mp-hero .mp-total");
      if(liveTotalEl) liveTotalEl.textContent = won(liveUtilityTotalFromDOM());
    }

    if(el.dataset.action === "set-savings-amount" || el.dataset.action === "set-savings-interest"){
      var savingsCard = document.querySelector("#mp-main .mp-account.is-expanded");
      if(savingsCard){
        var amountInput = savingsCard.querySelector('[data-action="set-savings-amount"]');
        var interestInput = savingsCard.querySelector('[data-action="set-savings-interest"]');
        var liveAmount = Math.abs(parseMoneyValue(amountInput.value));
        var liveInterest = Math.abs(parseMoneyValue(interestInput.value));
        var smLive = getSavingsMonth(state.currentMonth);
        var liveNet = liveAmount + liveInterest - savingsTxTotal(smLive);
        var liveTotalAll = totalSavingsAllTime() - savingsNet(smLive) + liveNet;
        var heroTotalEl = document.querySelector("#mp-main .mp-hero .mp-total");
        if(heroTotalEl) heroTotalEl.textContent = won(liveTotalAll);
        var savingsNetB = savingsCard.querySelector(".mp-loan-stats b");
        if(savingsNetB){
          savingsNetB.textContent = won(liveNet);
          savingsNetB.style.color = liveNet < 0 ? "var(--negative)" : "";
        }
      }
    }

    if(el.dataset.action === "set-loan-original"){
      liveUpdateLoanFromDOM(el.dataset.id);
    }
    if(el.dataset.action === "set-living-budget"){
      var livingHero = document.querySelector("#mp-main .mp-hero");
      if(livingHero){
        var lmLive = getLivingMonth(state.currentMonth);
        var liveBudget = Math.abs(parseMoneyValue(el.value));
        var liveSpent = lmLive.tx.reduce(function(s,t){ return (t.type||"expense")==="expense" ? s + Number(t.amount||0) : s; }, 0);
        var liveReceived = lmLive.tx.reduce(function(s,t){ return (t.type||"expense")==="income" ? s + Number(t.amount||0) : s; }, 0);
        var liveRemain = liveBudget - liveSpent + liveReceived;
        var livingTotalEl = livingHero.querySelector(".mp-total");
        if(livingTotalEl){
          livingTotalEl.textContent = won(liveRemain);
          livingTotalEl.classList.toggle("neg", liveRemain < 0);
          livingTotalEl.classList.toggle("pos", liveRemain >= 0);
        }
        var livePct = liveBudget > 0 ? Math.min(100,(liveSpent/liveBudget)*100) : (liveSpent>0?100:0);
        var liveBarClass = liveSpent > liveBudget && liveBudget>0 ? "over" : (livePct>=85?"warn":"");
        var liveBarEl = livingHero.querySelector(".mp-progress");
        if(liveBarEl){
          liveBarEl.className = "mp-progress " + liveBarClass;
          var liveFillEl = liveBarEl.querySelector("div");
          if(liveFillEl) liveFillEl.style.width = livePct + "%";
        }
      }
    }
  });

  root.addEventListener("submit", function(e){
    var form = e.target.closest("[data-action]");
    if(!form) return;
    e.preventDefault();
    var action = form.dataset.action;
    var fd = new FormData(form);

    if(action === "join-sync-code"){
      var joinCode = (fd.get("code") || "").trim();
      if(!/^[0-9]{6}$/.test(joinCode)){
        uiFlags.syncJoinError = "6자리 숫자 코드를 입력해주세요.";
        renderSyncPanel();
        return;
      }
      joinSyncCode(joinCode);
      return;
    }

    if(action === "unlock-personal"){
      var tryPw = fd.get("unlockcode") || "";
      sha256Hex(tryPw).then(function(hash){
        if(hash === state.personalPasswordHash){
          personalUnlocked = true;
          uiFlags.passwordError = "";
          render();
        } else {
          uiFlags.passwordError = "비밀번호가 올바르지 않아요.";
          render();
        }
      });
      return;
    }
    if(action === "submit-set-password"){
      var newPw1 = fd.get("newcode1") || "";
      var newPw2 = fd.get("newcode2") || "";
      if(newPw1.length < 4){ uiFlags.passwordError = "비밀번호는 4자 이상으로 설정해주세요."; renderPasswordModal(); return; }
      if(newPw1 !== newPw2){ uiFlags.passwordError = "비밀번호가 서로 달라요."; renderPasswordModal(); return; }
      sha256Hex(newPw1).then(function(hash){
        state.personalPasswordHash = hash;
        personalUnlocked = true;
        saveState();
        uiFlags.showPasswordSetup = false;
        uiFlags.passwordError = "";
        renderPasswordModal();
        render();
      });
      return;
    }
    if(action === "submit-change-password"){
      var curPw = fd.get("curcode") || "";
      var chgPw1 = fd.get("newcode1") || "";
      var chgPw2 = fd.get("newcode2") || "";
      sha256Hex(curPw).then(function(curHash){
        if(curHash !== state.personalPasswordHash){
          uiFlags.passwordError = "현재 비밀번호가 올바르지 않아요.";
          renderPasswordModal();
          return;
        }
        if(chgPw1.length < 4){ uiFlags.passwordError = "새 비밀번호는 4자 이상으로 설정해주세요."; renderPasswordModal(); return; }
        if(chgPw1 !== chgPw2){ uiFlags.passwordError = "새 비밀번호가 서로 달라요."; renderPasswordModal(); return; }
        sha256Hex(chgPw1).then(function(newHash){
          state.personalPasswordHash = newHash;
          saveState();
          uiFlags.showPasswordSetup = false;
          uiFlags.passwordError = "";
          renderPasswordModal();
        });
      });
      return;
    }
    if(action === "submit-remove-password"){
      var curPw2 = fd.get("curcode") || "";
      sha256Hex(curPw2).then(function(curHash2){
        if(curHash2 !== state.personalPasswordHash){
          uiFlags.passwordError = "비밀번호가 올바르지 않아요.";
          renderPasswordModal();
          return;
        }
        state.personalPasswordHash = "";
        saveState();
        uiFlags.showPasswordSetup = false;
        uiFlags.passwordError = "";
        renderPasswordModal();
      });
      return;
    }

    if(action === "goto-month"){
      commitPendingUtilityFields();
      commitPendingSavingsFields();
      commitPendingLivingFields();
      var gy = fd.get("year");
      var gm = String(fd.get("month")).padStart(2, "0");
      state.currentMonth = gy + "-" + gm;
      uiFlags.showMonthPicker = false;
      saveState(); render(); return;
    }

    if(action === "add-account"){
      var name = (fd.get("name")||"").trim();
      if(!name) return;
      var accountNumber = (fd.get("accountNumber")||"").trim();
      var purpose = (fd.get("purpose")||"").trim();
      var palette = ["#3182F6","#17BF83","#8B5CF6","#FFA929","#F0424E","#00B8D9"];
      var color = palette[state.accounts.length % palette.length];
      state.accounts.push({ id: uid(), name: name, balance: 0, accountNumber: accountNumber, color: color, purpose: purpose, fixedExpenses: [] });
      uiFlags.showAddAccount = false;
      saveState(); render(); return;
    }

    if(action === "add-fixed-expense"){
      var fxAccId = form.dataset.account;
      var fxAcc2 = state.accounts.find(function(a){ return a.id === fxAccId; });
      if(!fxAcc2) return;
      var fxDay = Math.min(31, Math.max(1, parseInt(fd.get("day"), 10) || 0));
      var fxName = (fd.get("name")||"").trim();
      var fxAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(!fxDay || !fxName || fxAmount <= 0) return;
      if(!Array.isArray(fxAcc2.fixedExpenses)) fxAcc2.fixedExpenses = [];
      fxAcc2.fixedExpenses.push({ id: uid(), day: fxDay, name: fxName, amount: fxAmount });
      uiFlags.showFixedAddForm[fxAccId] = false;
      saveState(); render(); return;
    }

    if(action === "add-loan"){
      var loanName = (fd.get("name")||"").trim();
      if(!loanName) return;
      var loanRate = (fd.get("rate")||"").trim();
      var loanOriginal = Math.abs(parseMoneyValue(fd.get("originalAmount")));
      var loanMonthly = Math.abs(parseMoneyValue(fd.get("monthlyPayment")));
      var loanInstallment = Math.max(0, parseInt(fd.get("currentInstallment"), 10) || 0);
      state.loans.push({ id: uid(), name: loanName, originalAmount: loanOriginal, startDate: "", rate: loanRate, monthlyPayment: loanMonthly, currentInstallment: loanInstallment });
      uiFlags.showAddLoan = false;
      saveState(); render(); return;
    }

    if(action === "add-annual-expense"){
      var aeName = (fd.get("name")||"").trim();
      var aeAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      var aeMonth = Math.min(12, Math.max(1, parseInt(fd.get("month"), 10) || 1));
      if(!aeName || aeAmount <= 0) return;
      state.savingsExpenses.push({ id: uid(), name: aeName, amount: aeAmount, month: aeMonth });
      saveState(); render(); return;
    }
    if(action === "save-annual-expense"){
      var aeEntry = state.savingsExpenses.find(function(f){ return f.id === form.dataset.id; });
      if(!aeEntry) return;
      var newAeName = (fd.get("name")||"").trim();
      var newAeAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      var newAeMonth = Math.min(12, Math.max(1, parseInt(fd.get("month"), 10) || 1));
      if(!newAeName || newAeAmount <= 0) return;
      aeEntry.name = newAeName;
      aeEntry.amount = newAeAmount;
      aeEntry.month = newAeMonth;
      uiFlags.editingAnnualExpense = null;
      saveState(); render(); return;
    }

    if(action === "add-tx"){
      var accId = form.dataset.account;
      var amount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(amount <= 0) return;
      var type = fd.get("type");
      var date = parseDotDateToISO(fd.get("date")) || todayISO;
      var memo = (fd.get("memo")||"").trim();
      var acc = state.accounts.find(function(a){ return a.id === accId; });
      if(!acc) return;
      var newId = uid();
      getLog(accId).push({ id: newId, date: date, memo: memo, amount: amount, type: type, ts: Date.now() });
      form.reset();
      saveState(); render();
      scrollRowIntoView(newId);
      return;
    }

    if(action === "add-savings-tx"){
      var svAmt = Math.abs(parseMoneyValue(fd.get("amount")));
      if(svAmt <= 0) return;
      var svm = getSavingsMonth(state.currentMonth);
      var svNewId = uid();
      svm.tx.push({ id: svNewId, date: parseDotDateToISO(fd.get("date")) || todayISO, memo: (fd.get("memo")||"").trim(), amount: svAmt, ts: Date.now() });
      form.reset();
      saveState(); render();
      scrollRowIntoView(svNewId);
      return;
    }
    if(action === "save-edit-savings-tx"){
      var svm2 = getSavingsMonth(state.currentMonth);
      var svEntry = (svm2.tx||[]).find(function(t){ return t.id === form.dataset.id; });
      if(!svEntry) return;
      var newSvAmt = Math.abs(parseMoneyValue(fd.get("amount")));
      if(newSvAmt <= 0) return;
      svEntry.amount = newSvAmt;
      svEntry.date = parseDotDateToISO(fd.get("date")) || svEntry.date;
      svEntry.memo = (fd.get("memo")||"").trim();
      uiFlags.editingSavingsTx = null;
      saveState(); render(); return;
    }

    if(action === "add-living-tx"){
      var amt2 = Math.abs(parseMoneyValue(fd.get("amount")));
      if(amt2 <= 0) return;
      var lm = getLivingMonth(state.currentMonth);
      lm.tx.push({ id: uid(), date: parseDotDateToISO(fd.get("date")) || todayISO, memo: (fd.get("memo")||"").trim(), amount: amt2, type: fd.get("type") || "expense" });
      saveState(); render(); return;
    }
  });

  var importInput = document.getElementById("mp-import-input");
  if(importInput){
    importInput.addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(evt){
        var imported;
        try{
          imported = JSON.parse(evt.target.result);
        }catch(err){
          alert("파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.");
          importInput.value = "";
          return;
        }
        if(!imported || typeof imported !== "object" || !Array.isArray(imported.accounts)){
          alert("올바른 백업 파일이 아니에요.");
          importInput.value = "";
          return;
        }
        if(!confirm("지금 있는 데이터를 지우고 이 백업 파일 내용으로 덮어쓸까요? 되돌릴 수 없어요.")){
          importInput.value = "";
          return;
        }
        var d = defaultState();
        var merged = Object.assign(d, imported, {
          accounts: imported.accounts || d.accounts,
          logs: imported.logs || {},
          savings: imported.savings || {},
          savingsExpenses: imported.savingsExpenses || [],
          living: imported.living || {},
          loans: imported.loans || [],
          utilities: imported.utilities || {}
        });
        migrateReflectedFlags(merged);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        localStorage.setItem(SYNC_UPDATED_KEY, new Date().toISOString());
        location.reload();
      };
      reader.onerror = function(){
        alert("파일을 읽는 중 문제가 생겼어요.");
        importInput.value = "";
      };
      reader.readAsText(file);
    });
  }

  function initSync(){
    var code = getSyncCode();
    if(!code || !supabaseClient) return;
    subscribeRealtime();
    syncStatus.syncing = true;
    supabaseClient.from("sync_data").select("*").eq("code", code).maybeSingle()
      .then(function(res){
        syncStatus.syncing = false;
        if(res.error || !res.data){
          renderSyncPanel();
          return;
        }
        var remoteUpdatedAt = new Date(res.data.updated_at).getTime();
        var localUpdatedAtRaw = localStorage.getItem(SYNC_UPDATED_KEY);
        var localUpdatedAt = localUpdatedAtRaw ? new Date(localUpdatedAtRaw).getTime() : 0;
        if(remoteUpdatedAt > localUpdatedAt){
          lastPushedSnapshot = JSON.stringify(res.data.data);
          applyRemoteState(res.data.data);
        } else {
          pushStateToCloud();
        }
        syncStatus.lastSyncedAt = new Date();
        renderSyncPanel();
      });
  }

  render();
  initSync();
  if(state.activeTab === "personal" && state.personalPasswordHash && !personalUnlocked){
    focusPersonalLockInput();
  }
})();
</script>
</body>
</html>
