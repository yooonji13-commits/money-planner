<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>머니플래너</title>
<meta name="description" content="개인 자산, 가족 월별 예산, 월 생활비를 관리하는 개인 가계부">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="머니플래너">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html,body{ margin:0; padding:0; }
  :root{
    color-scheme:light;
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-alt:#F4F6F8;
    --ink:#181C22;
    --muted:#8B95A1;
    --line:#EDEFF2;
    --accent:#3182F6;
    --accent-ink:#FFFFFF;
    --accent-soft:#EAF2FE;
    --positive:#17BF83;
    --negative:#F0424E;
    --warning:#FFA929;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:9px;
    --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }

  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  body{ background:var(--bg); }

  #mp-root{
    font-family:var(--font-ui);
    color:var(--ink);
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .mp-header{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:max(20px, env(safe-area-inset-top)) 20px 12px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .mp-header .mp-date{
    font-size:.86rem; color:var(--ink); font-weight:700; letter-spacing:-0.01em; flex-shrink:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mp-header-actions{ display:flex; gap:5px; flex-shrink:0; }
  .mp-reset-btn{
    font-family:var(--font-ui); background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:5px 9px; font-size:.68rem; font-weight:650; cursor:pointer; flex-shrink:0;
    white-space:nowrap;
  }
  .mp-reset-btn:hover{ color:var(--negative); border-color:var(--negative); }

  .mp-main{ flex:1; padding:14px 16px 104px; display:flex; flex-direction:column; gap:12px; }

  .mp-tab-sticky{
    position:sticky; top:var(--mp-header-h, 60px); z-index:4;
    background:var(--bg); display:flex; flex-direction:column; gap:12px;
    padding-top:2px; padding-bottom:2px; margin-top:-2px;
  }

  .mp-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px;
  }

  .mp-card + .mp-card{ margin-top:0; }

  .mp-hero{ padding:20px 18px; }
  .mp-hero .mp-total{ color:var(--ink); }

  .mp-label{
    font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  }

  .mp-total{
    font-size:2.1rem; font-weight:800; letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    margin-top:4px;
  }
  .mp-total.neg{ color:var(--negative); }
  .mp-total.pos{ color:var(--ink); }

  .mp-sub{ font-size:.85rem; color:var(--muted); margin-top:2px; }

  /* account cards */
  .mp-accounts-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .mp-account{
    background:var(--surface); border:1px solid var(--line);
    border-left-width:4px; border-left-style:solid; border-left-color:var(--acc-color, var(--accent));
    border-radius:var(--radius-lg);
    padding:14px 16px; display:flex; flex-direction:column; gap:8px;
  }
  .mp-account:not(.is-expanded){
    aspect-ratio:1/1; overflow:hidden; border-radius:50%;
    border:3px solid var(--acc-color, var(--accent));
    padding:14%; justify-content:center; cursor:pointer;
  }
  .mp-color-swatch{
    -webkit-appearance:none; appearance:none; width:22px; height:22px; flex-shrink:0;
    border:1px solid var(--line); border-radius:6px; padding:0; background:none; cursor:pointer;
  }
  .mp-color-swatch::-webkit-color-swatch-wrapper{ padding:2px; }
  .mp-color-swatch::-webkit-color-swatch{ border:none; border-radius:4px; }
  .mp-account-name-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; }
  .mp-account-name{ font-size:.88rem; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mp-account:not(.is-expanded) .mp-account-name{ white-space:normal; overflow:visible; font-size:.82rem; }
  .mp-edit-icon{ font-size:.88rem; padding:4px 7px; flex-shrink:0; }
  .mp-account-purpose{ font-size:.72rem; color:var(--muted); }
  .mp-account-number{
    font-size:.74rem; color:var(--muted); border:none; background:none;
    padding:2px 0; width:100%; font-variant-numeric:tabular-nums; flex:1; min-width:0;
  }
  .mp-account-purpose-input{
    font-size:.82rem; color:var(--ink); border:none; background:none; padding:2px 0; width:100%;
  }
  .mp-account-number-row{ display:flex; align-items:center; gap:6px; }
  .mp-detail-field{ display:flex; flex-direction:column; gap:2px; }
  .mp-fixed-list{ display:flex; flex-direction:column; gap:0; margin-top:2px; }
  .mp-fixed-row{
    display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:center;
    padding:7px 0; border-top:1px solid var(--line); font-size:.82rem;
  }
  .mp-fixed-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mp-fixed-amt{ font-variant-numeric:tabular-nums; font-weight:650; white-space:nowrap; }
  .mp-fixed-add{ display:grid; grid-template-columns:1fr 100px auto; gap:6px; margin-top:8px; }
  .mp-fixed-add input, .mp-fixed-edit input{ width:100%; }
  .mp-fixed-edit{ display:grid; grid-template-columns:1fr 100px auto auto; gap:6px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .mp-loan-meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .mp-loan-stats{ font-size:.78rem; color:var(--muted); margin-top:10px; }
  .mp-loan-stats b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .mp-loan-input{ width:100%; }
  .mp-util-chart{ width:100%; height:130px; display:block; margin-top:10px; }
  .mp-account-balance{ font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .mp-account-balance.neg{ color:var(--negative); }
  .mp-account-body{
    display:flex; flex-direction:column; align-items:flex-start;
    gap:1px;
  }
  .mp-account:not(.is-expanded) .mp-account-body{
    align-items:center; text-align:center;
  }
  .mp-balance-label{
    font-size:.62rem; color:var(--muted); font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    margin-top:4px;
  }
  .mp-account:not(.is-expanded) .mp-balance-label{ font-size:.55rem; margin-top:6px; }
  .mp-account-body .mp-balance-edit{
    font-size:1.2rem; font-weight:700; border:none; background:none; padding:2px 0; width:100%;
  }
  .mp-account:not(.is-expanded) .mp-balance-edit{ font-size:.92rem; text-align:center; }
  .mp-balance-row{ display:flex; align-items:flex-end; gap:10px; width:100%; }
  .mp-balance-field{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .mp-account-total{ font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; padding:2px 0; }
  .mp-account-total.neg{ color:var(--negative); }
  .mp-account:not(.is-expanded) .mp-balance-row{ flex-direction:column; align-items:center; gap:6px; }
  .mp-account:not(.is-expanded) .mp-balance-field{ align-items:center; }
  .mp-account:not(.is-expanded) .mp-account-total{ font-size:.9rem; text-align:center; }
  .mp-tools-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .mp-fixed-toggle-btn{
    font-family:var(--font-ui); background:var(--surface-alt); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; font-size:.72rem; font-weight:650; cursor:pointer;
  }
  .mp-fixed-toggle-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); }
  .mp-account-settings-panel{ display:flex; flex-direction:column; gap:10px; }
  .mp-account-detail{
    display:flex; flex-direction:column; gap:10px;
    margin-top:2px; padding-top:10px; border-top:1px solid var(--line);
  }
  .mp-account-settings-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mp-icon-btn{
    background:none; border:none; color:var(--muted); font-size:.78rem; padding:4px 6px;
    border-radius:var(--radius-sm); cursor:pointer;
  }
  .mp-icon-btn:hover{ background:var(--surface-alt); color:var(--ink); }
  .mp-icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  input[type="number"], input[type="text"], input[type="date"], select{
    font-family:var(--font-ui);
    background:var(--surface-alt);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:var(--radius-sm);
    padding:8px 10px;
    font-size:.85rem;
    font-variant-numeric:tabular-nums;
    height:38px;
    box-sizing:border-box;
    line-height:20px;
  }
  select{ padding:8px 6px; }
  input[type="date"]{
    -webkit-appearance:none; appearance:none;
    background:var(--surface-alt); border:1px solid var(--line); color:var(--ink);
  }

  input.mp-account-number{ background:none; border:none; padding:2px 0; border-radius:0; }
  input.mp-account-number:focus{ outline:none; border-bottom:1.5px solid var(--accent); }

  .mp-btn{
    font-family:var(--font-ui);
    background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:999px; padding:9px 16px; font-size:.85rem; font-weight:700;
    cursor:pointer; white-space:nowrap;
  }
  .mp-btn.ghost{
    background:none; color:var(--accent); border:1.5px solid var(--line);
  }
  .mp-btn.block{ width:100%; padding:11px; }
  .mp-btn.small{ padding:6px 12px; font-size:.78rem; }

  .mp-log-toggle{ font-size:.78rem; color:var(--accent); background:none; border:none; cursor:pointer; text-align:left; padding:0; font-weight:600; }
  .mp-log{ display:flex; flex-direction:column; margin-top:2px; }
  .mp-sort-toggle{ display:flex; gap:6px; }
  .mp-sort-btn{
    font-family:var(--font-ui); background:var(--surface-alt); color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:4px 11px; font-size:.72rem; font-weight:650; cursor:pointer;
  }
  .mp-sort-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); }
  .mp-tx-edit{
    display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px 0; border-top:1px solid var(--line);
    width:100%; box-sizing:border-box;
  }
  .mp-tx-edit > *{ min-width:0; }
  .mp-tx-edit select, .mp-tx-edit input{ height:32px; box-sizing:border-box; padding:0 8px; width:100%; font-size:.82rem; }
  .mp-tx-edit .mp-tx-edit-actions{ grid-column:1 / -1; display:flex; gap:6px; justify-content:flex-end; }

  /* month switcher */
  .mp-month-switch{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 2px 4px;
  }
  .mp-month-switch .mp-month-label{ font-weight:800; font-size:1.05rem; letter-spacing:-0.01em; }
  .mp-month-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:32px; height:32px; border-radius:50%; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .mp-month-picker{
    display:flex; gap:6px; align-items:center; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius-md);
    padding:10px; margin-bottom:2px;
  }
  .mp-month-picker select{ flex:1; min-width:0; }

  /* progress bar */
  .mp-progress{ height:6px; border-radius:99px; background:var(--surface-alt); overflow:hidden; margin-top:10px; }
  .mp-progress > div{ height:100%; border-radius:99px; background:var(--accent); }
  .mp-progress.warn > div{ background:var(--warning); }
  .mp-progress.over > div{ background:var(--negative); }
  .mp-carry-btn{ margin-top:12px; }

  .mp-tx-list{ display:flex; flex-direction:column; }
  .mp-tx-row{
    display:grid; grid-template-columns:38px 1fr 84px auto; gap:6px; align-items:center;
    padding:9px 0; border-top:1px solid var(--line); font-size:.85rem;
  }
  .mp-tx-row > *{ min-width:0; }
  .mp-tx-row .mp-tx-date{ color:var(--muted); font-size:.72rem; font-variant-numeric:tabular-nums; }
  .mp-tx-row .mp-tx-memo{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mp-tx-row .mp-tx-amt{ font-variant-numeric:tabular-nums; font-weight:650; color:var(--negative); white-space:nowrap; text-align:right; }
  .mp-tx-row .mp-tx-amt.income{ color:var(--positive); }
  .mp-tx-row.is-reflected{ opacity:.45; }
  .mp-tx-row.is-reflected .mp-tx-date{ cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px; }
  .mp-reflect-btn{ color:var(--accent); font-weight:700; font-size:.7rem; }
  @keyframes mp-reflect-pulse{
    0%{ background:var(--accent-soft); opacity:1; transform:scale(1.02); }
    100%{ background:transparent; opacity:.45; transform:scale(1); }
  }
  .mp-tx-row.mp-just-reflected{ animation:mp-reflect-pulse .5s ease; border-radius:var(--radius-sm); }
  .mp-log-card{ padding:6px 16px; margin-top:4px; }
  .mp-log-card .mp-log{ margin-top:0; }
  .mp-log-card .mp-empty{ padding:16px 0; }
  .mp-tx-add, .mp-tx-add-personal{
    display:grid; grid-template-columns:42px 96px 1fr 50px auto; gap:6px; margin-top:10px; align-items:center;
  }
  .mp-tx-add > *, .mp-tx-add-personal > *{ min-width:0; }
  .mp-tx-add select, .mp-tx-add input, .mp-tx-add-personal select, .mp-tx-add-personal input{
    padding:0 4px; font-size:.72rem; height:32px; box-sizing:border-box;
  }
  .mp-tx-add .mp-btn, .mp-tx-add-personal .mp-btn{ padding:0 8px; font-size:.74rem; height:32px; box-sizing:border-box; }

  .mp-empty{ color:var(--muted); font-size:.82rem; padding:10px 0; text-align:center; }

  /* tab bar */
  .mp-tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    max-width:480px; margin:0 auto;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; gap:6px; padding:10px 12px max(10px, env(safe-area-inset-bottom));
  }
  .mp-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--muted); font-family:var(--font-ui);
    font-size:.68rem; font-weight:650; padding:7px 2px; cursor:pointer; position:relative;
  }
  .mp-tab .mp-tab-icon{
    width:34px; height:24px; display:flex; align-items:center; justify-content:center;
  }
  .mp-tab.active{ color:var(--accent); }
  .mp-tab.active::before{
    content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--accent);
  }
  .mp-tab svg{ width:21px; height:21px; }

  .mp-add-account-form{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .mp-add-account-form input{ min-width:110px; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="mp-root">
  <header class="mp-header" id="mp-header">
    <div class="mp-date" id="mp-headerdate"></div>
    <div class="mp-header-actions">
      <button class="mp-reset-btn" data-action="export-data" type="button">내보내기</button>
      <button class="mp-reset-btn" data-action="trigger-import" type="button">가져오기</button>
      <button class="mp-reset-btn" id="mp-reset-btn" data-action="reset-tab" type="button">초기화</button>
    </div>
    <input type="file" id="mp-import-input" accept="application/json,.json" style="display:none;">
  </header>
  <main class="mp-main" id="mp-main"></main>
  <nav class="mp-tabbar">
    <button class="mp-tab" data-tab="personal">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg></span>
      개인
    </button>
    <button class="mp-tab" data-tab="living">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="4" width="15" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg></span>
      생활비
    </button>
    <button class="mp-tab" data-tab="family">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12c0-3.5 3-6.5 8-6.5 3 0 5 1 6.5 2.5L20 6.5V11l-1.7.5c.2.6.2 1.3.2 2 0 3.5-3 6-8 6s-6.5-2-6.5-2"/><path d="M9 9.2h.01"/><path d="M4 13.5 2.5 15" /><path d="M7 17.5 6 19.5M11 18l-.5 2"/></svg></span>
      저축
    </button>
    <button class="mp-tab" data-tab="loan">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.3"/><circle cx="17.5" cy="17.5" r="2.3"/></svg></span>
      대출
    </button>
    <button class="mp-tab" data-tab="utility">
      <span class="mp-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 21V9l6-4 6 4v12"/><path d="M10 21v-6h4v6"/><path d="M9 12h.01M15 12h.01M9 8.5h.01M15 8.5h.01"/></svg></span>
      관리비
    </button>
  </nav>
</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "mp_data_v1";
  var todayISO = new Date().toISOString().slice(0,10);
  var currentMonthKey = todayISO.slice(0,7);

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function defaultState(){
    return {
      activeTab: "personal",
      currentMonth: currentMonthKey,
      accounts: [],
      logs: {},
      savings: {},
      savingsExpenses: [],
      living: {},
      loans: [],
      utilities: {}
    };
  }

  function migrateReflectedFlags(s){
    Object.keys(s.logs || {}).forEach(function(accId){
      (s.logs[accId] || []).forEach(function(t){
        if(typeof t.reflected !== "boolean") t.reflected = true;
      });
    });
    (s.accounts || []).forEach(function(a){
      if(!Array.isArray(a.fixedExpenses)) a.fixedExpenses = [];
    });
    (s.loans || []).forEach(function(l){
      if(typeof l.originalAmount !== "number") l.originalAmount = 0;
      if(typeof l.startDate !== "string") l.startDate = "";
      if(typeof l.currentInstallment !== "number"){
        var maxInstallment = 0;
        if(Array.isArray(l.log)){
          l.log.forEach(function(t){ maxInstallment = Math.max(maxInstallment, Number(t.installment||0)); });
        }
        l.currentInstallment = maxInstallment;
      }
      delete l.log;
      delete l.color;
      delete l.balance;
    });
    return s;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      var merged = Object.assign(d, parsed, {
        accounts: parsed.accounts || d.accounts,
        logs: parsed.logs || {},
        savings: parsed.savings || {},
        savingsExpenses: parsed.savingsExpenses || [],
        living: parsed.living || {},
        loans: parsed.loans || [],
        utilities: parsed.utilities || {}
      });
      migrateReflectedFlags(merged);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
      return merged;
    }catch(e){
      return defaultState();
    }
  }

  var state = loadState();

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function won(n){
    n = Math.round(Number(n) || 0);
    var sign = n < 0 ? "-" : "";
    return sign + Math.abs(n).toLocaleString("ko-KR") + "원";
  }

  function monthLabel(key){
    var parts = key.split("-");

  function shiftMonth(key, delta){
    var y = parseInt(key.slice(0,4),10);
    var m = parseInt(key.slice(5,7),10) - 1;
    var d = new Date(y, m + delta, 1);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }

    if(!state.savings[key]) state.savings[key] = { amount: 0, interest: 0, tx: [] };

  }
  function savingsTxTotal(sm){
    return (sm.tx || []).reduce(function(s,t){ return s + Number(t.amount||0); }, 0);
  }
  function savingsNet(sm){
    return Number(sm.amount||0) + Number(sm.interest||0) - savingsTxTotal(sm);
  }
  function totalSavingsAllTime(){
    return Object.keys(state.savings).reduce(function(sum, mk){
      return sum + savingsNet(state.savings[mk]);
    }, 0);
  }
  function getLivingMonth(key){
    if(!state.living[key]) state.living[key] = { budget: 0, tx: [] };
    return state.living[key];
  }

  }

  function scrollRowIntoView(id){
    var el = document.querySelector('.mp-tx-row[data-id="' + id + '"]');
    if(!el) return;
    var header = document.getElementById("mp-header");
    var stickyWrap = document.querySelector(".mp-tab-sticky");
    var offset = (header ? header.offsetHeight : 0) + (stickyWrap ? stickyWrap.offsetHeight : 0);
    var rect = el.getBoundingClientRect();
    if(rect.top < offset || rect.bottom > window.innerHeight){
      var target = window.scrollY + rect.top - offset - 8;
      window.scrollTo(0, Math.max(0, target));
    }
  }

  function accountTotal(acc){
    var log = getLog(acc.id);
    var delta = log.reduce(function(s,t){
      if(!t.reflected) return s;
      return s + (t.type === "income" ? Number(t.amount||0) : -Number(t.amount||0));
    }, 0);
    return Number(acc.balance||0) + delta;
  }

  function loanRepaid(loan){
    return Number(loan.currentInstallment||0) * Number(loan.monthlyPayment||0);
  }
  function loanRemaining(loan){
    return Number(loan.originalAmount||0) - loanRepaid(loan);
  }
  function loanTotalInstallments(loan){
    var mp = Number(loan.monthlyPayment||0);
    if(mp <= 0) return 0;
    return Math.ceil(Number(loan.originalAmount||0) / mp);
  }
  function loanRemainingInstallments(loan){
    var t = loanTotalInstallments(loan);
    if(t <= 0) return 0;
    return Math.max(0, t - Number(loan.currentInstallment||0));
  }

  function monthPickerHTML(mk){

    for(var y = nowY - 6; y <= nowY + 4; y++){
      years += '<option value="' + y + '"' + (y === curY ? ' selected' : '') + '>' + y + '년</option>';
    }
    var months = "";

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){

    });
  }

  function formatNumberString(raw){
    raw = String(raw == null ? "" : raw);
    var negative = /^\s*-/.test(raw);
    var digits = raw.replace(/[^0-9]/g, "").replace(/^0+(?=\d)/, "");
    if(digits === "") return negative ? "-" : "";
    return (negative ? "-" : "") + Number(digits).toLocaleString("ko-KR");
  }

  function parseMoneyValue(raw){
    raw = String(raw == null ? "" : raw);
    var negative = /^\s*-/.test(raw);
    var digits = raw.replace(/[^0-9]/g, "");
    if(digits === "") return 0;
    return (negative ? -1 : 1) * Number(digits);
  }

    window.scrollBy(0, 1);

  // ---------- 관리비 탭 ----------
  function utilityChartHTML(currentKey){
    var months = [];
    for(var i = 5; i >= 0; i--){ months.push(shiftMonth(currentKey, -i)); }
    var totals = months.map(function(mk){
      var m = state.utilities[mk];
      return m ? utilityTotal(m) : 0;
    });
    var max = Math.max.apply(null, totals.concat([1]));
    var w = 300, h = 120, padTop = 20, padBottom = 22, padX = 22;
    var innerH = h - padTop - padBottom;
    var stepX = (w - padX * 2) / (months.length - 1);

    var points = totals.map(function(v, i){
      var x = padX + i * stepX;
      var y = padTop + innerH - (max > 0 ? (v / max) * innerH : 0);
      return { x: x, y: y, v: v, mk: months[i] };
    });

    var pathD = points.map(function(p, i){
      return (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
    }).join(' ');

    var marks = points.map(function(p){
      var isCurrent = p.mk === currentKey;
      var mlabel = parseInt(p.mk.slice(5,7), 10) + '월';
      return (p.v > 0 ?
          '<text x="' + p.x.toFixed(1) + '" y="' + (p.y - 8).toFixed(1) + '" font-size="7.5" fill="var(--muted)" text-anchor="middle">' + won(p.v).replace("원","") + '</text>'
        : '') +
        '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (isCurrent ? 4 : 3) + '" fill="' + (isCurrent ? 'var(--accent)' : 'var(--surface)') + '" stroke="var(--accent)" stroke-width="1.6"/>' +
        '<text x="' + p.x.toFixed(1) + '" y="' + (h - 6) + '" font-size="8.5" fill="' + (isCurrent ? 'var(--accent)' : 'var(--muted)') + '" font-weight="' + (isCurrent ? '700' : '400') + '" text-anchor="middle">' + mlabel + '</text>';
    }).join("");

    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="mp-util-chart" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="' + pathD + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      marks +
    '</svg>';
  }

      commitPendingSavingsFields();

  root.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.dataset.action;

    if(action === "reset-tab"){
      var tabName = TAB_NAMES[state.activeTab] || "현재 탭";
      if(!confirm("정말 " + tabName + " 탭의 데이터를 모두 지우고 초기화할까요? 되돌릴 수 없어요.")) return;
      if(state.activeTab === "personal"){
        state.accounts = [];
        state.logs = {};
        uiFlags.expandedAccounts = {};
        uiFlags.editingSettings = {};
        uiFlags.editingFixed = null;
        uiFlags.showFixed = {};
        uiFlags.showAddAccount = false;
      } else if(state.activeTab === "living"){
        state.living = {};
        uiFlags.editingLivingTx = null;
        uiFlags.showMonthPicker = false;
      } else if(state.activeTab === "family"){
        state.savings = {};
        state.savingsExpenses = [];
        uiFlags.showAnnualExpenses = false;
        uiFlags.editingAnnualExpense = null;
        uiFlags.editingSavingsTx = null;
      } else if(state.activeTab === "loan"){
        state.loans = [];
        uiFlags.expandedLoans = {};
        uiFlags.editingLoanSettings = {};
        uiFlags.showAddLoan = false;
      } else if(state.activeTab === "utility"){
        state.utilities = {};
      }
      saveState(); render();
      return;
    }

    if(action === "export-data"){
      var exportStr = localStorage.getItem(STORAGE_KEY) || JSON.stringify(state);
      var blob = new Blob([exportStr], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "moneyplanner-backup-" + todayISO + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return;
    }

    if(action === "trigger-import"){
      var fileInput = document.getElementById("mp-import-input");
      if(fileInput) fileInput.click();
      return;
    }

    if(action === "carry-over-next-month"){
      var srcKey = state.currentMonth;
      var srcMonth = getLivingMonth(srcKey);
      if(srcMonth.carriedOver){ alert("이미 이번 달 잔액을 다음 달로 이월했어요."); return; }
      var spentX = srcMonth.tx.reduce(function(s,t){ return (t.type||"expense")==="expense" ? s + Number(t.amount||0) : s; }, 0);
      var receivedX = srcMonth.tx.reduce(function(s,t){ return (t.type||"expense")==="income" ? s + Number(t.amount||0) : s; }, 0);
      var remainX = Number(srcMonth.budget||0) - spentX + receivedX;
      if(remainX <= 0){ alert("이월할 잔액이 없어요."); return; }
      if(!confirm(monthLabel(srcKey) + '의 잔액 ' + won(remainX) + '을(를) 다음 달로 이월할까요?')) return;
      var nextKey = shiftMonth(srcKey, 1);
      var nextMonth = getLivingMonth(nextKey);
      nextMonth.tx.push({
        id: uid(),
        date: lastDayOfMonth(srcKey),
        memo: monthLabel(srcKey) + ' 이월',
        amount: remainX,
        type: "income"
      });
      srcMonth.carriedOver = true;
      saveState(); render();
      return;
    }

    if(action === "show-add-account"){ uiFlags.showAddAccount = true; render(); return; }
    if(action === "cancel-add-account"){ uiFlags.showAddAccount = false; render(); return; }

    if(action === "toggle-settings"){
      uiFlags.editingSettings[el.dataset.id] = !uiFlags.editingSettings[el.dataset.id];
      render();
      return;
    }
    if(action === "toggle-fixed-list"){
      uiFlags.showFixed[el.dataset.id] = !uiFlags.showFixed[el.dataset.id];
      if(!uiFlags.showFixed[el.dataset.id]) uiFlags.editingFixed = null;
      render();
      return;
    }
    if(action === "copy-account-number"){
      var accCopy = state.accounts.find(function(a){ return a.id === el.dataset.id; });
      if(!accCopy || !accCopy.accountNumber) return;
      var text = accCopy.accountNumber;
      var fallbackCopy = function(){
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try{ document.execCommand("copy"); }catch(err){}
        document.body.removeChild(ta);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
      var original = el.textContent;
      el.textContent = "✓";
      setTimeout(function(){ el.textContent = original; }, 1200);
      return;
    }
    if(action === "toggle-annual-expenses"){
      uiFlags.showAnnualExpenses = !uiFlags.showAnnualExpenses;
      if(!uiFlags.showAnnualExpenses) uiFlags.editingAnnualExpense = null;
      render(); return;
    }
    if(action === "start-edit-annual-expense"){
      uiFlags.editingAnnualExpense = el.dataset.id;
      render(); return;
    }
    if(action === "cancel-edit-annual-expense"){
      uiFlags.editingAnnualExpense = null;
      render(); return;
    }
    if(action === "delete-annual-expense"){
      state.savingsExpenses = state.savingsExpenses.filter(function(f){ return f.id !== el.dataset.id; });
      if(uiFlags.editingAnnualExpense === el.dataset.id) uiFlags.editingAnnualExpense = null;
      saveState(); render(); return;
    }
    if(action === "start-edit-savings-tx"){
      uiFlags.editingSavingsTx = el.dataset.id;
      render(); return;
    }
    if(action === "cancel-edit-savings-tx"){
      uiFlags.editingSavingsTx = null;
      render(); return;
    }
    if(action === "delete-savings-tx"){
      var sm = getSavingsMonth(state.currentMonth);
      sm.tx = (sm.tx||[]).filter(function(t){ return t.id !== el.dataset.id; });
      if(uiFlags.editingSavingsTx === el.dataset.id) uiFlags.editingSavingsTx = null;
      saveState(); render(); return;
    }

    if(action === "delete-account"){
      if(!confirm("이 계좌를 삭제할까요? 기록도 함께 삭제돼요.")) return;
      state.accounts = state.accounts.filter(function(a){ return a.id !== el.dataset.id; });
      delete state.logs[el.dataset.id];
      saveState(); render(); return;
    }

    if(action === "start-edit-fixed"){
      uiFlags.editingFixed = { accountId: el.dataset.account, id: el.dataset.id };
      render(); return;
    }
    if(action === "cancel-edit-fixed"){
      uiFlags.editingFixed = null;
      render(); return;
    }
    if(action === "delete-fixed-expense"){
      var fxAcc = state.accounts.find(function(a){ return a.id === el.dataset.account; });
      if(fxAcc) fxAcc.fixedExpenses = (fxAcc.fixedExpenses||[]).filter(function(f){ return f.id !== el.dataset.id; });
      if(uiFlags.editingFixed && uiFlags.editingFixed.id === el.dataset.id) uiFlags.editingFixed = null;
      saveState(); render(); return;
    }

    if(action === "show-add-loan"){ uiFlags.showAddLoan = true; render(); return; }
    if(action === "cancel-add-loan"){ uiFlags.showAddLoan = false; render(); return; }
    if(action === "delete-loan"){
      if(!confirm("이 대출을 삭제할까요?")) return;
      state.loans = state.loans.filter(function(l){ return l.id !== el.dataset.id; });
      delete uiFlags.expandedLoans[el.dataset.id];
      delete uiFlags.editingLoanSettings[el.dataset.id];
      saveState(); render(); return;
    }

    if(action === "toggle-loan"){
      var toggleLoanId = el.dataset.id;
      var pendingLoan = state.loans.find(function(l){ return l.id === toggleLoanId; });
      if(pendingLoan){
        var pendingOriginalInput = main.querySelector('[data-action="set-loan-original"][data-id="' + toggleLoanId + '"]');
        if(pendingOriginalInput) pendingLoan.originalAmount = parseMoneyValue(pendingOriginalInput.value);
        var pendingInstallmentInput = main.querySelector('[data-action="set-loan-installment"][data-id="' + toggleLoanId + '"]');
        if(pendingInstallmentInput) pendingLoan.currentInstallment = Math.max(0, parseInt(pendingInstallmentInput.value, 10) || 0);
      }
      var willExpandLoan = !uiFlags.expandedLoans[toggleLoanId];
      if(willExpandLoan) uiFlags.expandedLoans = {};
      uiFlags.expandedLoans[toggleLoanId] = willExpandLoan;
      if(!willExpandLoan){ uiFlags.editingLoanSettings[toggleLoanId] = false; }
      saveState(); render(); return;
    }
    if(action === "toggle-loan-settings"){
      uiFlags.editingLoanSettings[el.dataset.id] = !uiFlags.editingLoanSettings[el.dataset.id];
      render(); return;
    }

    if(action === "toggle-log"){
      var toggleId = el.dataset.id;
      var pendingInput = main.querySelector('.mp-balance-edit[data-id="' + toggleId + '"]');
      if(pendingInput){
        var pendingAcc = state.accounts.find(function(a){ return a.id === toggleId; });
        if(pendingAcc) pendingAcc.balance = parseMoneyValue(pendingInput.value);
      }
      var willExpand = !uiFlags.expandedAccounts[toggleId];
      if(willExpand) uiFlags.expandedAccounts = {};
      uiFlags.expandedAccounts[toggleId] = willExpand;
      if(!willExpand){ uiFlags.editingSettings[toggleId] = false; uiFlags.editingFixed = null; uiFlags.showFixed[toggleId] = false; }
      saveState(); render(); return;
    }
    if(action === "delete-tx"){
      var log = getLog(el.dataset.account);
      state.logs[el.dataset.account] = log.filter(function(t){ return t.id !== el.dataset.id; });
      if(uiFlags.editingTx && uiFlags.editingTx.txId === el.dataset.id) uiFlags.editingTx = null;
      saveState(); render(); return;
    }

    if(action === "reflect-tx"){
      var logR = getLog(el.dataset.account);
      var txR = logR.find(function(t){ return t.id === el.dataset.id; });
      if(txR) txR.reflected = true;
      uiFlags.justReflected = el.dataset.id;
      saveState(); render();
      setTimeout(function(){ uiFlags.justReflected = null; }, 550);
      return;
    }

    if(action === "start-edit-tx"){
      uiFlags.editingTx = { accountId: el.dataset.account, txId: el.dataset.id };
      render(); return;
    }
    if(action === "set-log-sort"){
      uiFlags.logSortOrder = el.dataset.order;
      render(); return;
    }
    if(action === "cancel-edit-tx"){
      uiFlags.editingTx = null;
      render(); return;
    }

    if(action === "delete-living-tx"){
      var lm = getLivingMonth(state.currentMonth);
      lm.tx = lm.tx.filter(function(t){ return t.id !== el.dataset.id; });
      if(uiFlags.editingLivingTx === el.dataset.id) uiFlags.editingLivingTx = null;
      saveState(); render(); return;
    }

    if(action === "start-edit-living-tx"){
      uiFlags.editingLivingTx = el.dataset.id;
      render(); return;
    }
    if(action === "cancel-edit-living-tx"){
      uiFlags.editingLivingTx = null;
      render(); return;
    }

    if(action === "month-prev"){ commitPendingUtilityFields(); commitPendingSavingsFields(); state.currentMonth = shiftMonth(state.currentMonth, -1); saveState(); render(); return; }
    if(action === "month-next"){ commitPendingUtilityFields(); commitPendingSavingsFields(); state.currentMonth = shiftMonth(state.currentMonth, 1); saveState(); render(); return; }
    if(action === "toggle-month-picker"){ uiFlags.showMonthPicker = !uiFlags.showMonthPicker; render(); return; }
    if(action === "save-utility"){
      commitPendingUtilityFields();
      saveState();
      var savedLabel = el.textContent;
      el.textContent = "저장됨 ✓";
      el.disabled = true;
      setTimeout(function(){ el.textContent = savedLabel; el.disabled = false; }, 1200);
      return;
    }
  });

  var lastDateTap = { id: null, time: 0 };
  root.addEventListener("click", function(e){
    var dateEl = e.target.closest(".mp-tx-row.is-reflected .mp-tx-date");
    if(!dateEl) return;
    var row = dateEl.closest(".mp-tx-row");
    var key = row.dataset.account + ":" + row.dataset.id;
    var now = Date.now();
    if(lastDateTap.key === key && (now - lastDateTap.time) < 600){
      lastDateTap = { key: null, time: 0 };
      var log = getLog(row.dataset.account);
      var tx = log.find(function(t){ return t.id === row.dataset.id; });
      if(tx){ tx.reflected = false; saveState(); render(); }
      return;
    }
    lastDateTap = { key: key, time: now };
  });

  root.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    var el = e.target;
    if(el.classList && (el.classList.contains("mp-account-number") || el.classList.contains("mp-account-purpose-input") || el.classList.contains("mp-balance-edit"))){
      e.preventDefault();
      el.blur();
    }
  });

  root.addEventListener("focusout", function(e){
    var el = e.target;
    if(el.classList && el.classList.contains("mp-account-number")){
      var id = el.dataset.id;
      var acc = state.accounts.find(function(a){ return a.id === id; });
      if(acc) acc.accountNumber = el.value.trim();
      saveState(); render();
      return;
    }
    if(el.classList && el.classList.contains("mp-account-purpose-input")){
      var id2 = el.dataset.id;
      var acc2 = state.accounts.find(function(a){ return a.id === id2; });
      if(acc2) acc2.purpose = el.value.trim();
      saveState(); render();
      return;
    }
  });

  root.addEventListener("input", function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains("mp-money")) return;
    var caret = el.selectionStart;
    var oldVal = el.value;
    var digitsBefore = (oldVal.slice(0, caret).match(/[0-9]/g) || []).length;
    var negative = /^\s*-/.test(oldVal);
    var formatted = formatNumberString(oldVal);
    el.value = formatted;
    var count = 0, pos = formatted.length;
    for(var i=0;i<formatted.length;i++){
      if(/[0-9]/.test(formatted[i])) count++;
      if(count === digitsBefore){ pos = i+1; break; }
    }
    if(digitsBefore === 0) pos = (negative && formatted.charAt(0)==="-") ? 1 : 0;
    el.setSelectionRange(pos, pos);

    if(el.dataset.action === "set-utility-field"){
      var liveTotalEl = document.querySelector("#mp-main .mp-hero .mp-total");
      if(liveTotalEl) liveTotalEl.textContent = won(liveUtilityTotalFromDOM());
    }

    if(el.dataset.action === "set-savings-amount" || el.dataset.action === "set-savings-interest"){
      var savingsHero = document.querySelector("#mp-main .mp-hero");
      if(savingsHero){
        var amountInput = savingsHero.querySelector('[data-action="set-savings-amount"]');
        var interestInput = savingsHero.querySelector('[data-action="set-savings-interest"]');
        var liveAmount = Math.abs(parseMoneyValue(amountInput.value));
        var liveInterest = Math.abs(parseMoneyValue(interestInput.value));
        var smLive = getSavingsMonth(state.currentMonth);
        var liveNet = liveAmount + liveInterest - savingsTxTotal(smLive);
        var liveTotalAll = totalSavingsAllTime() - savingsNet(smLive) + liveNet;
        var savingsTotals = savingsHero.querySelectorAll(".mp-total");
        if(savingsTotals[0]) savingsTotals[0].textContent = won(liveTotalAll);
        var savingsNetB = savingsHero.querySelector(".mp-loan-stats b");
        if(savingsNetB){
          savingsNetB.textContent = won(liveNet);
          savingsNetB.style.color = liveNet < 0 ? "var(--negative)" : "";
        }
      }
    }
  });

  root.addEventListener("change", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.dataset.action;
    var val = Number(el.value) || 0;

    if(action === "set-balance"){
      var acc = state.accounts.find(function(a){ return a.id === el.dataset.id; });
      if(acc){ acc.balance = parseMoneyValue(el.value); saveState(); render(); }
      return;
    }
    if(action === "set-color"){
      var accC = state.accounts.find(function(a){ return a.id === el.dataset.id; });
      if(accC){ accC.color = el.value; saveState(); render(); }
      return;
    }
    if(action === "set-loan-rate"){
      var loanR = state.loans.find(function(l){ return l.id === el.dataset.id; });
      if(loanR){ loanR.rate = el.value.trim(); saveState(); }
      return;
    }
    if(action === "set-loan-monthly"){
      var loanM = state.loans.find(function(l){ return l.id === el.dataset.id; });
      if(loanM){ loanM.monthlyPayment = parseMoneyValue(el.value); saveState(); render(); }
      return;
    }
    if(action === "set-loan-original"){
      var loanO = state.loans.find(function(l){ return l.id === el.dataset.id; });
      if(loanO){ loanO.originalAmount = parseMoneyValue(el.value); saveState(); render(); }
      return;
    }
    if(action === "set-loan-startdate"){
      var loanT = state.loans.find(function(l){ return l.id === el.dataset.id; });
      if(loanT){ loanT.startDate = el.value; saveState(); render(); }
      return;
    }
    if(action === "set-loan-installment"){
      var loanI = state.loans.find(function(l){ return l.id === el.dataset.id; });
      if(loanI){ loanI.currentInstallment = Math.max(0, parseInt(el.value, 10) || 0); saveState(); render(); }
      return;
    }
    if(action === "set-savings-amount"){
      var smA = getSavingsMonth(state.currentMonth);
      smA.amount = parseMoneyValue(el.value);
      saveState(); updateSavingsDisplay(); return;
    }
    if(action === "set-savings-interest"){
      var smI = getSavingsMonth(state.currentMonth);
      smI.interest = parseMoneyValue(el.value);
      saveState(); updateSavingsDisplay(); return;
    }
    if(action === "set-living-budget"){
      var lm = getLivingMonth(state.currentMonth);
      lm.budget = parseMoneyValue(el.value);
      saveState(); render(); return;
    }
    if(action === "set-utility-field"){
      var um = getUtilityMonth(state.currentMonth);
      var ufield = el.dataset.field;
      if(ufield === "payDate") um.payDate = el.value;
      else um[ufield] = Math.abs(parseMoneyValue(el.value));
      saveState();
      updateUtilityDisplay();
      return;
    }
  });

  root.addEventListener("submit", function(e){
    var form = e.target.closest("[data-action]");
    if(!form) return;
    e.preventDefault();
    var action = form.dataset.action;
    var fd = new FormData(form);

    if(action === "goto-month"){
      commitPendingUtilityFields();
      commitPendingSavingsFields();
      var gy = fd.get("year");
      var gm = String(fd.get("month")).padStart(2, "0");
      state.currentMonth = gy + "-" + gm;
      uiFlags.showMonthPicker = false;
      saveState(); render(); return;
    }

    if(action === "add-account"){
      var name = (fd.get("name")||"").trim();
      if(!name) return;
      var accountNumber = (fd.get("accountNumber")||"").trim();
      var purpose = (fd.get("purpose")||"").trim();
      var palette = ["#3182F6","#17BF83","#8B5CF6","#FFA929","#F0424E","#00B8D9"];
      var color = palette[state.accounts.length % palette.length];
      state.accounts.push({ id: uid(), name: name, balance: 0, accountNumber: accountNumber, color: color, purpose: purpose, fixedExpenses: [] });
      uiFlags.showAddAccount = false;
      saveState(); render(); return;
    }

    if(action === "add-fixed-expense"){
      var fxAccId = form.dataset.account;
      var fxAcc2 = state.accounts.find(function(a){ return a.id === fxAccId; });
      if(!fxAcc2) return;
      var fxName = (fd.get("name")||"").trim();
      var fxAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(!fxName || fxAmount <= 0) return;
      if(!Array.isArray(fxAcc2.fixedExpenses)) fxAcc2.fixedExpenses = [];
      fxAcc2.fixedExpenses.push({ id: uid(), name: fxName, amount: fxAmount });
      saveState(); render(); return;
    }

    if(action === "save-fixed-expense"){
      var fxAccId2 = form.dataset.account;
      var fxAcc3 = state.accounts.find(function(a){ return a.id === fxAccId2; });
      var fx = fxAcc3 && (fxAcc3.fixedExpenses||[]).find(function(f){ return f.id === form.dataset.id; });
      if(!fx) return;
      var newFxName = (fd.get("name")||"").trim();
      var newFxAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(!newFxName || newFxAmount <= 0) return;
      fx.name = newFxName;
      fx.amount = newFxAmount;
      uiFlags.editingFixed = null;
      saveState(); render(); return;
    }

    if(action === "add-loan"){
      var loanName = (fd.get("name")||"").trim();
      if(!loanName) return;
      var loanRate = (fd.get("rate")||"").trim();
      var loanOriginal = Math.abs(parseMoneyValue(fd.get("originalAmount")));
      var loanMonthly = Math.abs(parseMoneyValue(fd.get("monthlyPayment")));
      var loanInstallment = Math.max(0, parseInt(fd.get("currentInstallment"), 10) || 0);
      state.loans.push({ id: uid(), name: loanName, originalAmount: loanOriginal, startDate: "", rate: loanRate, monthlyPayment: loanMonthly, currentInstallment: loanInstallment });
      uiFlags.showAddLoan = false;
      saveState(); render(); return;
    }

    if(action === "add-annual-expense"){
      var aeName = (fd.get("name")||"").trim();
      var aeAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(!aeName || aeAmount <= 0) return;
      state.savingsExpenses.push({ id: uid(), name: aeName, amount: aeAmount });
      saveState(); render(); return;
    }
    if(action === "save-annual-expense"){
      var aeEntry = state.savingsExpenses.find(function(f){ return f.id === form.dataset.id; });
      if(!aeEntry) return;
      var newAeName = (fd.get("name")||"").trim();
      var newAeAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(!newAeName || newAeAmount <= 0) return;
      aeEntry.name = newAeName;
      aeEntry.amount = newAeAmount;
      uiFlags.editingAnnualExpense = null;
      saveState(); render(); return;
    }

    if(action === "add-tx"){
      var accId = form.dataset.account;
      var amount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(amount <= 0) return;
      var type = fd.get("type");
      var date = fd.get("date") || todayISO;
      var memo = (fd.get("memo")||"").trim();
      var acc = state.accounts.find(function(a){ return a.id === accId; });
      if(!acc) return;
      var newId = uid();
      getLog(accId).push({ id: newId, date: date, memo: memo, amount: amount, type: type, ts: Date.now(), reflected: false });
      form.reset();
      saveState(); render();
      scrollRowIntoView(newId);
      return;
    }

    if(action === "save-edit-tx"){
      var accId2 = form.dataset.account;
      var txId = form.dataset.id;
      var acc2 = state.accounts.find(function(a){ return a.id === accId2; });
      var log2 = getLog(accId2);
      var entry3 = log2.find(function(t){ return t.id === txId; });
      if(!acc2 || !entry3) return;
      var newAmount = Math.abs(parseMoneyValue(fd.get("amount")));
      if(newAmount <= 0) return;
      var newType = fd.get("type");
      var newDate = fd.get("date") || entry3.date;
      var newMemo = (fd.get("memo")||"").trim();
      entry3.amount = newAmount;
      entry3.type = newType;
      entry3.date = newDate;
      entry3.memo = newMemo;
      uiFlags.editingTx = null;
      saveState(); render(); return;
    }

    if(action === "add-savings-tx"){
      var svAmt = Math.abs(parseMoneyValue(fd.get("amount")));
      if(svAmt <= 0) return;
      var svm = getSavingsMonth(state.currentMonth);
      var svNewId = uid();
      svm.tx.push({ id: svNewId, date: fd.get("date") || todayISO, memo: (fd.get("memo")||"").trim(), amount: svAmt, ts: Date.now() });
      form.reset();
      saveState(); render();
      scrollRowIntoView(svNewId);
      return;
    }
    if(action === "save-edit-savings-tx"){
      var svm2 = getSavingsMonth(state.currentMonth);
      var svEntry = (svm2.tx||[]).find(function(t){ return t.id === form.dataset.id; });
      if(!svEntry) return;
      var newSvAmt = Math.abs(parseMoneyValue(fd.get("amount")));
      if(newSvAmt <= 0) return;
      svEntry.amount = newSvAmt;
      svEntry.date = fd.get("date") || svEntry.date;
      svEntry.memo = (fd.get("memo")||"").trim();
      uiFlags.editingSavingsTx = null;
      saveState(); render(); return;
    }

    if(action === "add-living-tx"){
      var amt2 = Math.abs(parseMoneyValue(fd.get("amount")));
      if(amt2 <= 0) return;
      var lm = getLivingMonth(state.currentMonth);
      lm.tx.push({ id: uid(), date: fd.get("date") || todayISO, memo: (fd.get("memo")||"").trim(), amount: amt2, type: fd.get("type") || "expense" });
      saveState(); render(); return;
    }

    if(action === "save-edit-living-tx"){
      var lmE = getLivingMonth(state.currentMonth);
      var txE = lmE.tx.find(function(t){ return t.id === form.dataset.id; });
      if(!txE) return;
      var newAmt = Math.abs(parseMoneyValue(fd.get("amount")));
      if(newAmt <= 0) return;
      txE.amount = newAmt;
      txE.type = fd.get("type") || "expense";
      txE.date = fd.get("date") || txE.date;
      txE.memo = (fd.get("memo")||"").trim();
      uiFlags.editingLivingTx = null;
      saveState(); render(); return;
    }
  });

  var importInput = document.getElementById("mp-import-input");
  if(importInput){
    importInput.addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(evt){
        var imported;
        try{
          imported = JSON.parse(evt.target.result);
        }catch(err){
          alert("파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.");
          importInput.value = "";
          return;
        }
        if(!imported || typeof imported !== "object" || !Array.isArray(imported.accounts)){
          alert("올바른 백업 파일이 아니에요.");
          importInput.value = "";
          return;
        }
        if(!confirm("지금 있는 데이터를 지우고 이 백업 파일 내용으로 덮어쓸까요? 되돌릴 수 없어요.")){
          importInput.value = "";
          return;
        }
        var d = defaultState();
        var merged = Object.assign(d, imported, {
          accounts: imported.accounts || d.accounts,
          logs: imported.logs || {},
          savings: imported.savings || {},
          savingsExpenses: imported.savingsExpenses || [],
          living: imported.living || {},
          loans: imported.loans || [],
          utilities: imported.utilities || {}
        });
        migrateReflectedFlags(merged);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        location.reload();
      };
      reader.onerror = function(){
        alert("파일을 읽는 중 문제가 생겼어요.");
        importInput.value = "";
      };
      reader.readAsText(file);
    });
  }

  render();
})();
</script>
</body>
</html>
